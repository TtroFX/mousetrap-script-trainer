name: Apply Vocabulary Block 292-582

on:
  push:
    branches:
      - vocab/block-292-582-20260828
    paths:
      - 'scripts/apply-vocabulary-block-292-582.mjs'
      - 'data/vocabulary-rebuild/block-292-582-*.b64'
      - 'data/vocabulary-rebuild/block-292-582-defs-*.json'
      - '.github/workflows/apply-vocabulary-block-292-582.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize apply script
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const path='scripts/apply-vocabulary-block-292-582.mjs';
          let src=fs.readFileSync(path,'utf8');
          const loader="const defs = Object.assign({}, ...Array.from({ length: 8 }, (_, i) => readJson('data/vocabulary-rebuild/block-292-582-defs-' + i + '.json')));";
          src=src.replace(/const defs = decodeParts\(\[[\s\S]*?\]\);/, loader);
          src=src.replace(/const defs = decode\('data\/vocabulary-rebuild\/block-292-582-defs\.b64'\);/, loader);
          if(!src.includes(loader)) throw new Error('Dictionary definition loader normalization failed');
          const precreate=`for (const [lemma, def] of Object.entries(defs)) {
            if (!def?.meaning) continue;
            ensureDictionary(lemma);
          }

          `;
          if(src.includes(precreate)) src=src.replace(precreate,'');

          const oldDialogue=`let dialogueSpecsMatched = 0;
          const unmatchedDialogueSpecs = [];
          for (const [surface, lemma, inThisPlay, category] of dialogue) {
            let matches = 0;
            for (const speech of scopeSpeeches) {
              if (!containsSurface(speech.text, surface)) continue;
              matches++;
              addOrImprove(speech.id, { surface, lemma, inThisPlay }, 'dialogue', category);
            }
            if (matches) dialogueSpecsMatched++;
            else unmatchedDialogueSpecs.push({ surface, lemma });
          }
          `;
          const newDialogue=`// PDF stage-characterization omitted by the generic stage tokenizer.
          addOrImprove('act1-scene2-speech-0143', {
            surface: 'cockney accent',
            lemma: 'Cockney accent',
            inThisPlay: 'Trotterの登場時のト書きが、彼の話し方の特徴として指定している。'
          }, 'stage', 'stage');

          const dialogueSurfaceAliases = new Map([
            ['think fit', 'thought fit'],
            ['have no patience with', 'no patience with'],
            ['get over', 'gets over'],
            ['have no use for', 'no use for'],
            ['place reliance on', 'reliance to be placed on'],
            ['bully', 'bullying'],
            ['have a share in', 'with a share in']
          ]);
          const stageBackedDialogueSpecs = new Set([
            'Cockney accent', 'judicial manner', 'wall brackets', 'receiver',
            'dazed', 'torch', 'tune in', 'with a start', 'at breaking point'
          ]);
          const outsideTargetDialogueSpecs = new Set(['poker', 'bus ticket', 'London bus ticket']);
          let dialogueSpecsMatched = 0;
          const unmatchedDialogueSpecs = [];
          const excludedDialogueSpecs = [];
          for (const [surface, lemma, inThisPlay, category] of dialogue) {
            const sourceSurface = dialogueSurfaceAliases.get(surface) || surface;
            let matches = 0;
            for (const speech of scopeSpeeches) {
              if (!containsSurface(speech.text, sourceSurface)) continue;
              matches++;
              addOrImprove(speech.id, { surface: sourceSurface, lemma, inThisPlay }, 'dialogue', category);
            }
            if (matches) {
              dialogueSpecsMatched++;
              continue;
            }
            if (stageBackedDialogueSpecs.has(surface)) {
              const stageHit = [...scopeIds].some(id => vocab[id].some(item => lower(item.lemma) === lower(lemma)));
              if (!stageHit) fail('Expected stage-backed candidate missing: ' + surface + ' -> ' + lemma);
              excludedDialogueSpecs.push({ surface, lemma, reason: 'stage-direction-association' });
              continue;
            }
            if (outsideTargetDialogueSpecs.has(surface)) {
              excludedDialogueSpecs.push({ surface, lemma, reason: 'outside-target-candidate' });
              continue;
            }
            unmatchedDialogueSpecs.push({ surface, lemma });
          }
          `;
          if(src.includes(oldDialogue)) src=src.replace(oldDialogue,newDialogue);
          else if(!src.includes('const dialogueSurfaceAliases = new Map([')) throw new Error('Dialogue normalization block not found');
          if(!src.includes('excludedDialogueSpecs,')) {
            src=src.replace('dialogueSpecsMatched,\n    unmatchedDialogueSpecs,', 'dialogueSpecsMatched,\n    unmatchedDialogueSpecs,\n    excludedDialogueSpecs,');
          }
          fs.writeFileSync(path,src);
          EOF

      - name: Validate definition chunks
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          let count=0; const seen=new Set();
          for(let i=0;i<8;i++){
            const d=JSON.parse(fs.readFileSync(`data/vocabulary-rebuild/block-292-582-defs-${i}.json`,'utf8'));
            for(const [k,v] of Object.entries(d)){
              if(seen.has(k.toLowerCase())) throw new Error('Duplicate definition '+k);
              if(!String(v?.meaning||'').trim()) throw new Error('Missing definition meaning '+k);
              seen.add(k.toLowerCase()); count++;
            }
          }
          if(count!==279) throw new Error(`Definition count ${count}/279`);
          console.log(JSON.stringify({status:'PASS',definitions:count}));
          EOF

      - name: Apply vocabulary expansion
        run: node scripts/apply-vocabulary-block-292-582.mjs

      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs

      - name: Validate production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only

      - name: Assert block QA
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/vocabulary-block-292-582-report.json','utf8'));
          if(r.status!=='PASS') throw new Error('Block report is not PASS');
          if(r.scope?.speeches!==291) throw new Error('Scope speech count mismatch');
          if((r.sourceAudit?.unmatchedDialogueSpecs||[]).length) throw new Error('Unmatched dialogue specs: '+JSON.stringify(r.sourceAudit.unmatchedDialogueSpecs));
          if((r.sourceAudit?.excludedDialogueSpecs||[]).length!==12) throw new Error('Excluded candidate audit mismatch: '+JSON.stringify(r.sourceAudit.excludedDialogueSpecs));
          if(r.qa?.duplicateAssociations!==0) throw new Error('Duplicate associations');
          if(r.qa?.danglingReferences!==0) throw new Error('Dangling references');
          if(r.qa?.forbiddenOutsideScopeMutations!==0) throw new Error('Forbidden out-of-scope mutations');
          if(r.qa?.jsonParse!=='PASS' || r.qa?.dictionaryMeaningConsistency!=='PASS' || r.qa?.inThisPlayValidation!=='PASS') throw new Error('Semantic QA failure');
          console.log(JSON.stringify(r,null,2));
          EOF

      - name: Commit validated production data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-vocabulary-block-292-582.mjs \
                  mousetrap_line_vocabulary.json \
                  mousetrap_word_dictionary.json \
                  data/canonical-production-contract.json \
                  data/canonical-integration-manifest.json \
                  data/vocabulary-block-292-582-report.json \
                  app/scripts/assemble-production.mjs \
                  materials/005_VOCABULARY_CORE.txt \
                  materials/006_VOCABULARY_USAGE.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Expand vocabulary for speeches 292-582'
          git push
