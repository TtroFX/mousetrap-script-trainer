name: Gesture English Audit
on:
  push:
    branches: ["feature/gesture-controls"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List hard-coded Japanese UI fragments
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const file of ['app/index.html','app/offline.html','app/src/main.js','app/src/resume-bookmarks.js','app/src/gesture-controls.js']){
            const s=fs.readFileSync(file,'utf8');
            const matches=[...s.matchAll(/[^`'"\n]{0,55}[ぁ-んァ-ヶ一-龠][^`'"\n]{0,55}/g)].map(x=>x[0].trim());
            console.log('\n### '+file+' ('+matches.length+')');
            console.log([...new Set(matches)].join('\n'));
          }
          NODE
