name: Stage Directions Integration

on:
  push:
    branches: ['feature/pdf-stage-directions']
    paths:
      - 'scripts/apply-stage-directions-integration.py'
      - '.github/workflows/stage-directions-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical stage data
        run: node scripts/validate-stage-directions.mjs
      - name: Apply production integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-stage-directions-integration.py')
          s=p.read_text(encoding='utf-8')
          old="s=regex_once(s,r'function openLine\\(scene,line\\)\\{.*\\}\\nfunction lineView\\(q\\)\\{.*\\}',line_stage,'main line/stage views',re.S)"
          new="s=regex_once(s,r'^function openLine\\(scene,line\\)\\{.*\\}\\nfunction lineView\\(q\\)\\{.*\\}$',line_stage,'main line/stage views',re.M)"
          if old not in s: raise SystemExit('migration patch target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 scripts/apply-stage-directions-integration.py
      - name: Align browser QA with combined Reader sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tests/gesture_english.e2e.spec.js')
          s=p.read_text(encoding='utf-8')
          old="const rows=MTS_INDEX_ZERO.store.getScene(scene);for(let i=1;i<rows.length-1;i++)if(rows[i].speaker==='MOLLIE'&&rows[i+1].speaker!=='MOLLIE'&&(MTS_INDEX_ZERO.store.getGrammar(rows[i].id).length||MTS_INDEX_ZERO.store.getVocabulary(rows[i].id).length))return{scene,line:rows[i].id,next:rows[i+1].id};"
          new="const rows=MTS_INDEX_ZERO.store.getReaderSequence(scene);for(let i=1;i<rows.length-1;i++){const cur=rows[i],nxt=rows[i+1];if(cur.kind==='speech'&&nxt.kind==='speech'&&cur.speech.speaker==='MOLLIE'&&nxt.speech.speaker!=='MOLLIE'&&(MTS_INDEX_ZERO.store.getGrammar(cur.speech.id).length||MTS_INDEX_ZERO.store.getVocabulary(cur.speech.id).length))return{scene,line:cur.speech.id,next:nxt.speech.id};}"
          if old not in s: raise SystemExit('gesture test target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('app/tests/stage_directions.e2e.spec.js')
          s=p.read_text(encoding='utf-8')
          if 'await stageRow.click();' not in s: raise SystemExit('stage click target missing')
          s=s.replace('await stageRow.click();','await stageRow.click({force:true});',1)
          marker="const order=await page.evaluate(()=>{const block=document.querySelector('.stage-context-block'),translation=document.querySelector('.translation');"
          if marker not in s: raise SystemExit('translation-order target missing')
          s=s.replace(marker,"await expect(page.locator('.translation')).toBeVisible();"+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate runtime and exact artifact
        run: |
          node scripts/validate-stage-directions.mjs
          node scripts/validate-vocabulary-semantics.mjs
          python3 app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report /tmp/chunking-stage-integration.json
          cd app
          node --check src/config.js
          node --check src/data-store.js
          node --check src/main.js
          node --check src/gesture-controls.js
          node --check sw.js
          node --check scripts/assemble-production.mjs
          node tests/index_zero_static.mjs
          node tests/offline_pwa_static.mjs
          node scripts/assemble-production.mjs --verify-only
          node scripts/assemble-production.mjs --out-dir ../public
          test -e ../public/mousetrap_stage_directions.json
      - name: Install browser QA
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run complete browser regression
        working-directory: app
        run: npm run test:e2e
      - name: Commit verified production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts/validate-stage-directions.mjs .github/workflows/app-qa.yml .github/workflows/pages.yml
          git reset scripts/apply-stage-directions-integration.py .github/workflows/stage-directions-integrate.yml .github/workflows/stage-directions-decode.yml data/stage-upload-parts 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No production changes'; exit 0; fi
          git commit -m 'Integrate PDF stage directions into Reader [skip ci]'
          git push
