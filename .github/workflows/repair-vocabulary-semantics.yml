name: Repair Vocabulary Semantics

on:
  push:
    branches:
      - fix/vocabulary-semantic-closure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocabulary-semantic-closure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair phrase aliases and audit surface collisions
        run: node scripts/repair-vocabulary-phrase-aliases.mjs
      - name: Apply semantic repairs
        run: node scripts/repair-vocabulary-semantics.mjs
      - name: Validate repaired canonical data
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit repaired production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json data/vocabulary-semantic-repair-report.json data/vocabulary-phrase-alias-report.json
          if git diff --cached --quiet; then
            echo "No vocabulary closure data changes to commit."
            exit 0
          fi
          git commit -m "Repair vocabulary semantic and phrase alias separation"
          git push origin HEAD:fix/vocabulary-semantic-closure
