name: Apply Japanese stage-direction polish

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stage-ja-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply concise natural Japanese summaries
        env:
          STAGE_JA_FIXES_B64: ""
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, pathlib, re, zlib
          source_sha = "94d46d2afe7504d2010c10b3ef4f1017bc3adfe0c09ab86bfd837167357c397b"
          fixes = json.loads(zlib.decompress(base64.b64decode(os.environ["STAGE_JA_FIXES_B64"])).decode("utf-8"))
          suspicious = re.compile(
              r"バック オフ|キス 彼女|対象を指さす|ジャンプ|リーリング|リーダリング|導入事例|"
              r"ノートパソコン|ツイルリング|シャウト|プロテクション|チェック 彼女|"
              r"スタートしました|リコイル|楽しみ方|巻き戻し|シャッギング|チェストファー弓|"
              r"夕方の紙|彼女のへ|で座る|紙を撮る|ログを入れる|お電話にて|食堂テーブルに傾く|手を投げる"
          )
          def apply(path):
              p = pathlib.Path(path)
              data = json.loads(p.read_text(encoding="utf-8"))
              entries = data.get("entries", [])
              assert data.get("source", {}).get("pdfSha256") == source_sha, f"{path}: source hash mismatch"
              assert len(entries) == 777, f"{path}: {len(entries)}/777 entries"
              changed = 0
              for key, summary in fixes.items():
                  i = int(key)
                  if entries[i].get("summaryJa") != summary:
                      entries[i]["summaryJa"] = summary
                      changed += 1
              errors = []
              for i, entry in enumerate(entries):
                  summary = str(entry.get("summaryJa", "")).strip()
                  if not summary or len(summary) > 64 or re.search(r"[a-z]{2,}", summary) or re.search(r"ト書き|指定|補足|説明|ます", summary):
                      errors.append((i, "basic", summary))
                  if suspicious.search(summary):
                      errors.append((i, "suspicious", summary))
                  text = str(entry.get("text", ""))
                  if ("幕が上がる" in summary or "幕が下りる" in summary) and not re.search(r"\bCurtain\b.{0,18}\b(?:rises|falls)\b", text):
                      errors.append((i, "false-theatre-curtain", summary))
              if errors:
                  raise SystemExit("quality gate failed: " + repr(errors[:50]))
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({"path": path, "entries": len(entries), "fixes": len(fixes), "changed": changed, "status": "PASS"}, ensure_ascii=False))
          apply("mousetrap_stage_directions.json")
          apply("app/src/mousetrap_stage_directions.json")
          PYCODE
          cmp mousetrap_stage_directions.json app/src/mousetrap_stage_directions.json

      - name: Validate canonical data
        run: node scripts/validate-stage-directions.mjs

      - name: Commit polished summaries
        run: |
          if git diff --quiet -- mousetrap_stage_directions.json app/src/mousetrap_stage_directions.json; then
            echo "No stage-direction changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mousetrap_stage_directions.json app/src/mousetrap_stage_directions.json
          git commit -m "fix: polish Japanese stage directions"
          git push origin HEAD:main
