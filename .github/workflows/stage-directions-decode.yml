name: Decode Stage Directions

on:
  push:
    branches: ['feature/pdf-stage-directions']
    paths:
      - 'data/stage-upload-parts/**'
      - '.github/workflows/stage-directions-decode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate stage-direction JSON
        run: |
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const parts=Array.from({length:7},(_,i)=>`data/stage-upload-parts/part-${i+1}.txt`);
          for(const p of parts) if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const encoded=parts.map(p=>fs.readFileSync(p,'utf8').trim()).join('');
          const raw=zlib.gunzipSync(Buffer.from(encoded,'base64')).toString('utf8');
          const data=JSON.parse(raw);
          if(data.schemaVersion!==1) throw new Error('stage schemaVersion');
          if(data.counts?.standalone!==5||data.counts?.attached!==772||data.counts?.total!==777||data.counts?.malformedBracketRecovered!==1) throw new Error(`stage counts ${JSON.stringify(data.counts)}`);
          if(!Array.isArray(data.entries)||data.entries.length!==777) throw new Error('stage entries');
          const ids=new Set(); let standalone=0, attached=0, malformed=0;
          const placements={before:0,delivery:0,after:0};
          const scenes=new Set(['act1-scene1','act1-scene2','act2']);
          for(const entry of data.entries){
            if(!entry||typeof entry!=='object'||!String(entry.id||'').trim()||ids.has(entry.id)) throw new Error('stage id invalid/duplicate');
            ids.add(entry.id);
            if(!scenes.has(entry.sceneId)||!String(entry.text||'').trim()||!String(entry.summaryJa||'').trim()) throw new Error(`stage core invalid ${entry.id}`);
            if(!Array.isArray(entry.sourcePages)||!entry.sourcePages.length||entry.sourcePages.some(p=>!Number.isInteger(p)||p<1||p>84)) throw new Error(`stage sourcePages ${entry.id}`);
            if(!Array.isArray(entry.vocabulary)||!entry.vocabulary.length) throw new Error(`stage vocabulary ${entry.id}`);
            for(const v of entry.vocabulary) if(!String(v?.surface||'').trim()||!String(v?.lemma||'').trim()||!String(v?.meaning||'').trim()||!String(v?.note||'').trim()) throw new Error(`stage vocab invalid ${entry.id}`);
            if(!Array.isArray(entry.notes)||!entry.notes.length||entry.notes.some(n=>!String(n||'').trim())) throw new Error(`stage notes ${entry.id}`);
            if(entry.kind==='scene-setting'){
              standalone++;
              if(!entry.anchor||!['before','after'].includes(entry.anchor.type)||!String(entry.anchor.speechId||'').trim()) throw new Error(`scene setting anchor ${entry.id}`);
            }else if(entry.kind==='stage-direction'){
              attached++;
              if(!String(entry.speechId||'').trim()||!['before','delivery','after'].includes(entry.placement)) throw new Error(`attached placement ${entry.id}`);
              placements[entry.placement]++;
              if(entry.malformedSourceBracket) malformed++;
            }else throw new Error(`stage kind ${entry.id}`);
          }
          if(standalone!==5||attached!==772||malformed!==1) throw new Error(`stage derived counts ${standalone}/${attached}/${malformed}`);
          if(placements.before!==236||placements.delivery!==411||placements.after!==125) throw new Error(`stage placements ${JSON.stringify(placements)}`);
          fs.writeFileSync('mousetrap_stage_directions.json',JSON.stringify(data,null,2)+'\n');
          console.log(JSON.stringify({status:'PASS',entries:data.entries.length,standalone,attached,malformed,placements,pdfSha256:data.source?.pdfSha256},null,2));
          NODE
      - name: Commit decoded canonical stage data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mousetrap_stage_directions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Decode canonical stage directions [skip ci]'
          git push
