name: Integrate front-half A2+ vocabulary

on:
  push:
    branches: [main]
    paths:
      - 'data/a2plus-front-half-integration/definitions-*.json'
      - 'data/a2plus-front-half-integration/review-policy.json'
      - 'scripts/integrate-front-half-a2plus-vocabulary.mjs'
      - '.github/workflows/integrate-front-half-a2plus-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align global dictionary lookup with canonical semantic validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate-front-half-a2plus-vocabulary.mjs')
          s = p.read_text()
          old1 = "const dictionaryByNormAfter = new Map(Object.entries(dictionary).map(([k,v]) => [norm(k), v]));"
          new1 = "const dictionaryByExactKeyAfter = new Map(Object.entries(dictionary).map(([k,v]) => [String(k).trim().toLowerCase(), v]));"
          old2 = "const de = dictionaryByNormAfter.get(norm(lemma));"
          new2 = "const de = dictionaryByExactKeyAfter.get(String(lemma).trim().toLowerCase());"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected integrator lookup lines not found')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
      - name: Apply reviewed front-half A2+ vocabulary
        run: node scripts/integrate-front-half-a2plus-vocabulary.mjs
      - name: Verify expected outputs
        run: |
          test -s data/a2plus-front-half-integration/integration-qa.json
          grep -q '"status": "PASS"' data/a2plus-front-half-integration/integration-qa.json
          grep -q '"selectedLemmas": 179' data/a2plus-front-half-integration/integration-qa.json
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/integrate-front-half-a2plus-vocabulary.mjs \
            mousetrap_line_vocabulary.json \
            mousetrap_word_dictionary.json \
            data/canonical-production-contract.json \
            data/canonical-integration-manifest.json \
            data/a2plus-front-half-integration/integration-qa.json
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate front-half A2+ vocabulary"
          git push
