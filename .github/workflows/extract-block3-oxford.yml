name: Extract Block 3 Oxford Candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-block3-oxford.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify candidates
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/block-3-oxford-audit.json','utf8'));
          const d=JSON.parse(fs.readFileSync('mousetrap_word_dictionary.json','utf8'));
          const safe=[], ambiguous=[];
          for(const x of r.unresolved){
            const lower=x.oxfordEntries.some(e=>['a1','a2'].includes(e.level));
            const rec={word:x.word,forms:x.observedForms,levels:x.oxfordEntries.map(e=>`${e.pos}:${e.level}`),hasNeutral:Boolean(d[x.word]?.coreMeaning)};
            (lower?ambiguous:safe).push(rec);
          }
          const out={unresolvedCount:r.unresolvedCount,safeCount:safe.length,ambiguousCount:ambiguous.length,safeMissingNeutral:safe.filter(x=>!x.hasNeutral).map(x=>x.word),safe,ambiguous};
          fs.writeFileSync('data/vocabulary-rebuild/block-3-oxford-summary.json',JSON.stringify(out,null,2)+'\n');
          EOF
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocabulary-rebuild/block-3-oxford-summary.json
          git commit -m 'Classify Block 3 Oxford candidates'
          git push
