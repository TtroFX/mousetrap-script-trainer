name: Build Vocabulary Block 5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-vocabulary-block-5.mjs'
      - 'scripts/apply-block-5-neutral-supplement.mjs'
      - 'scripts/audit-oxford-b1plus-block-5.mjs'
      - 'scripts/validate-vocabulary-block.mjs'
      - 'data/vocabulary-rebuild/block-5-neutral-seed.json'
      - 'data/vocabulary-rebuild/block-5-neutral-supplement.json'
      - 'data/vocabulary-rebuild/block-5-oxford-review.json'
      - 'data/context-outline-patches/block-5.json'
      - 'data/mousetrap_context_outline.json'
      - '.github/workflows/build-vocabulary-block-5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Block 5 vocabulary data
        run: node scripts/build-vocabulary-block-5.mjs
      - name: Apply neutral dictionary supplement
        run: node scripts/apply-block-5-neutral-supplement.mjs
      - name: Validate Block 1 regression
        run: node scripts/validate-vocabulary-block.mjs block-1
      - name: Validate Block 2 regression
        run: node scripts/validate-vocabulary-block.mjs block-2
      - name: Validate Block 3 regression
        run: node scripts/validate-vocabulary-block.mjs block-3
      - name: Validate Block 4 regression
        run: node scripts/validate-vocabulary-block.mjs block-4
      - name: Validate Block 5 structure
        run: node scripts/validate-vocabulary-block.mjs block-5
      - name: Audit Oxford B1+ candidates
        run: node scripts/audit-oxford-b1plus-block-5.mjs
      - name: Show neutral fallback status
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/block-5-neutral-fallbacks.json','utf8'));
          console.log(JSON.stringify(f,null,2));
          EOF
      - name: Commit generated Block 5 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocabulary-rebuild/block-5-line-vocabulary.json \
                  data/vocabulary-rebuild/block-5-b1plus-coverage.json \
                  data/vocabulary-rebuild/block-5-dictionary.json \
                  data/vocabulary-rebuild/block-5-dictionary-supplement.json \
                  data/vocabulary-rebuild/block-5-neutral-fallbacks.json \
                  data/vocabulary-rebuild/block-5-oxford-audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate Block 5 vocabulary rebuild'
          git push
