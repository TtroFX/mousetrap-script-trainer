name: Audit Vocabulary Full Coverage

on:
  push:
    branches:
      - audit/vocabulary-full-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-full-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit dialogue vocabulary coverage
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocabulary-full-coverage-audit.json
          if git diff --cached --quiet; then
            echo "No audit report changes."
            exit 0
          fi
          git commit -m "Record full dialogue vocabulary coverage audit"
          git push origin HEAD:audit/vocabulary-full-coverage
