name: Audit Vocabulary Full Coverage

on:
  push:
    branches:
      - audit/vocabulary-full-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-full-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix audit morphology typo
        run: node scripts/fix-vocabulary-coverage-audit-typo.mjs
      - name: Audit before repair
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply safe repairs
        run: node scripts/apply-safe-vocabulary-full-coverage.mjs
      - name: Re-audit
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply consensus context repairs
        run: node scripts/apply-consensus-polysemy-coverage.mjs
      - name: Apply manual context resolutions
        run: node scripts/apply-manual-dialogue-polysemy-coverage.mjs
      - name: Re-audit context repairs
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply reviewed vocabulary additions
        run: node scripts/apply-suspicious-dialogue-coverage.mjs
      - name: Converge safe candidates
        run: node scripts/converge-safe-vocabulary-coverage.mjs
      - name: Final coverage audit
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Historical review cross-check
        run: node scripts/crosscheck-historical-vocabulary-coverage.mjs
      - name: Build focused review
        run: node scripts/build-dialogue-coverage-review-focus.mjs
      - name: Build context residual
        run: node scripts/build-dialogue-polysemy-residual.mjs
      - name: Export residual ledger
        run: node scripts/export-dialogue-suspicious-review.mjs
      - name: Classify residual token types
        run: node scripts/classify-dialogue-coverage-residual.mjs
      - name: Validate semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-vocabulary-full-coverage.mjs mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json data/vocabulary-full-coverage-audit.json data/vocabulary-full-coverage-summary.json data/vocabulary-full-coverage-safe-repair.json data/vocabulary-full-coverage-polysemy-consensus-repair.json data/vocabulary-full-coverage-polysemy-manual-repair.json data/vocabulary-full-coverage-historical-crosscheck.json data/vocabulary-full-coverage-review-focus.json data/vocabulary-full-coverage-polysemy-residual.json data/vocabulary-full-coverage-suspicious-review.tsv data/vocabulary-full-coverage-suspicious-review.json data/vocabulary-full-coverage-suspicious-repair.json data/vocabulary-full-coverage-classification.json
          if git diff --cached --quiet; then
            echo "No dialogue coverage changes."
            exit 0
          fi
          git commit -m "Close full dialogue vocabulary coverage review"
          git push origin HEAD:audit/vocabulary-full-coverage
