name: Audit Vocabulary Full Coverage

on:
  push:
    branches:
      - audit/vocabulary-full-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-full-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit dialogue vocabulary coverage
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply remaining safe dialogue coverage repairs
        run: node scripts/apply-safe-vocabulary-full-coverage.mjs
      - name: Re-audit after safe repair
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply consensus polysemy coverage repairs
        run: node scripts/apply-consensus-polysemy-coverage.mjs
      - name: Apply manual residual polysemy resolutions
        run: node scripts/apply-manual-dialogue-polysemy-coverage.mjs
      - name: Re-audit after manual polysemy repair
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Apply newly exposed safe coverage repairs
        run: node scripts/apply-safe-vocabulary-full-coverage.mjs
      - name: Audit dialogue vocabulary coverage final
        run: node scripts/audit-vocabulary-full-coverage.mjs
      - name: Cross-check historical B1 plus and Oxford reviews
        run: node scripts/crosscheck-historical-vocabulary-coverage.mjs
      - name: Build focused residual review
        run: node scripts/build-dialogue-coverage-review-focus.mjs
      - name: Build compact polysemy residual
        run: node scripts/build-dialogue-polysemy-residual.mjs
      - name: Export suspicious residual ledger
        run: node scripts/export-dialogue-suspicious-review.mjs
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit repaired data and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json data/vocabulary-full-coverage-audit.json data/vocabulary-full-coverage-summary.json data/vocabulary-full-coverage-safe-repair.json data/vocabulary-full-coverage-polysemy-consensus-repair.json data/vocabulary-full-coverage-polysemy-manual-repair.json data/vocabulary-full-coverage-historical-crosscheck.json data/vocabulary-full-coverage-review-focus.json data/vocabulary-full-coverage-polysemy-residual.json data/vocabulary-full-coverage-suspicious-review.tsv data/vocabulary-full-coverage-suspicious-review.json
          if git diff --cached --quiet; then
            echo "No dialogue coverage changes."
            exit 0
          fi
          git commit -m "Record suspicious dialogue vocabulary review ledger"
          git push origin HEAD:audit/vocabulary-full-coverage
