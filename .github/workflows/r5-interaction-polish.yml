name: Finalize r5 Interaction Polish
on:
  push:
    branches:
      - fix/line-detail-return-scroll
permissions:
  contents: write
concurrency:
  group: r5-interaction-polish
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply r5 source changes
        run: |
          python app/scripts/apply-r5.py
          node --check app/src/main.js
          node --check app/src/resume-bookmarks.js
          node --check app/tests/r5_behavior.e2e.spec.js
      - name: Build and verify exact artifact
        run: |
          node app/scripts/build-learning-structure.mjs --root . --out app/mousetrap_line_structure.json
          cd app
          npm run test:static
          npm run verify:production
          rm -rf ../public
          node scripts/assemble-production.mjs --out-dir ../public
          grep -q 'index-zero-2026-08-26-r5' ../public/pwa-version.json
      - name: Install Chromium
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run full Chromium QA
        working-directory: app
        run: npm run test:e2e
      - name: Commit verified r5 implementation
        run: |
          rm -rf app/node_modules app/test-results public
          rm -f app/mousetrap_line_structure.json app/package-lock.json
          rm -f app/scripts/apply-r5.py
          rm -f .github/workflows/r5-interaction-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'r5: polish Script return, bookmarks, role emphasis, and study notes'
          git push origin HEAD:fix/line-detail-return-scroll
