name: Interpretation Scene QA

on:
  push:
    branches:
      - "feature/interpretation-act1-scene1"
      - "feature/interpretation-act1-scene2"
      - "feature/interpretation-act2"
    paths:
      - 'data/interpretation/**'
      - 'scripts/validate-interpretation-scene.mjs'
      - '.github/workflows/interpretation-scene-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate interpretation data
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            feature/interpretation-act1-scene1) SCENE=act1-scene1 ;;
            feature/interpretation-act1-scene2) SCENE=act1-scene2 ;;
            feature/interpretation-act2) SCENE=act2 ;;
            *) echo "Unsupported branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          node scripts/validate-interpretation-scene.mjs "$SCENE"
