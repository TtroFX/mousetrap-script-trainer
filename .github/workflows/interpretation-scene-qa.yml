name: Interpretation Scene QA

on:
  push:
    branches: ["feature/interpretation-act1-scene1"]
    paths:
      - 'data/interpretation/**'
      - 'scripts/validate-interpretation-scene.mjs'
      - '.github/workflows/interpretation-scene-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Act 1 Scene 1 interpretation
        run: node scripts/validate-interpretation-scene.mjs act1-scene1
