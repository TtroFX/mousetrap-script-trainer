name: Repair stage-direction speech leakage

on:
  push:
    branches: ["repair/stage-direction-speech-leakage"]
    paths:
      - "scripts/repair-stage-direction-speech-leakage.mjs"
      - "scripts/finalize-stage-direction-repair.py"
      - "scripts/repair-a2plus-generator-invariant.py"
      - ".github/workflows/repair-stage-direction-speech-leakage.yml"

permissions:
  contents: write

jobs:
  repair-rebuild-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Repair canonical spoken text and recover stage cue
        run: |
          node scripts/repair-stage-direction-speech-leakage.mjs
          node scripts/canonicalize-stage-directions.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned chunk parser
        run: |
          python -m pip install --disable-pip-version-check "click==8.3.1" "spacy==3.8.11"
          python -m pip install --disable-pip-version-check "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Rebuild and validate canonical line structure
        run: |
          python app/scripts/chunking-v1-runtime.py --root . --out app/mousetrap_line_structure.json --model en_core_web_sm
          python app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report data/chunking-v1-qa.json

      - name: Synchronize production contracts and regression guards
        run: python scripts/finalize-stage-direction-repair.py

      - name: Regenerate A2+ candidate lists from corrected spoken text
        run: |
          python scripts/repair-a2plus-generator-invariant.py
          node scripts/generate-a2plus-candidate-lists.mjs

      - name: Validate canonical and runtime data
        run: |
          python -m py_compile scripts/finalize-stage-direction-repair.py scripts/repair-a2plus-generator-invariant.py
          rm -rf scripts/__pycache__
          node scripts/validate-stage-directions.mjs
          node --check scripts/repair-stage-direction-speech-leakage.mjs
          node --check scripts/generate-a2plus-candidate-lists.mjs
          node --check app/src/data-store.js
          node --check app/scripts/assemble-production.mjs
          cd app
          node tests/stage_directions_static.mjs
          node tests/pdf_pages_static.mjs
          node tests/index_zero_static.mjs
          node tests/offline_pwa_static.mjs
          node scripts/assemble-production.mjs --verify-only

      - name: Assert corrected line and recovered stage cue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('mousetrap_script_data.json','utf8'));
          const rows=Object.values(s).flatMap(x=>x.speeches||[]);
          const t=rows.find(x=>x.id==='act1-scene2-speech-0308');
          if(t?.text!=='Ah.') throw new Error(JSON.stringify(t));
          const bad=rows.filter(x=>/[\[\]{}]/.test(String(x.text||'')));
          if(bad.length) throw new Error(JSON.stringify(bad));
          const st=JSON.parse(fs.readFileSync('mousetrap_stage_directions.json','utf8')).entries.filter(x=>x.malformedSourceBracket===true);
          if(st.length!==1||st[0].text.trim()!=='He moves above the sofa table.'||st[0].speechId!==t.id||st[0].placement!=='after') throw new Error(JSON.stringify(st));
          console.log('spoken/stage separation PASS',t,st[0]);
          NODE

      - name: Commit and push repaired canonical state
        run: |
          git add -A
          git status --short
          git commit -m 'Fix stage direction leaked into Trotter speech [skip repair]'
          git push origin HEAD:repair/stage-direction-speech-leakage
