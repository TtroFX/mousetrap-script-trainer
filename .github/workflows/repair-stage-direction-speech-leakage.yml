name: Repair stage-direction speech leakage

on:
  push:
    branches: ["repair/stage-direction-speech-leakage"]
    paths:
      - "scripts/repair-stage-direction-speech-leakage.mjs"
      - ".github/workflows/repair-stage-direction-speech-leakage.yml"

permissions:
  contents: write

jobs:
  repair-rebuild-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Repair canonical spoken text and recover stage cue
        run: |
          node scripts/repair-stage-direction-speech-leakage.mjs
          node scripts/canonicalize-stage-directions.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned chunk parser
        run: |
          python -m pip install --disable-pip-version-check "click==8.3.1" "spacy==3.8.11"
          python -m pip install --disable-pip-version-check "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Rebuild canonical line structure
        run: |
          python app/scripts/chunking-v1-runtime.py --root . --out app/mousetrap_line_structure.json --model en_core_web_sm
          python app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report data/chunking-v1-qa.json

      - name: Synchronize live count contracts, manifests, hashes, and PWA build
        run: |
          python - <<'PY'
          import hashlib,json,re
          from collections import Counter
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def dump(p,v): Path(p).write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def patch(p,rules):
            text=Path(p).read_text(encoding='utf-8')
            for pattern,repl in rules:
              text,n=re.subn(pattern,repl,text)
              if n<1: raise SystemExit(f'{p}: pattern not found: {pattern}')
            Path(p).write_text(text,encoding='utf-8')

          structure=load('app/mousetrap_line_structure.json')
          c=structure['counts']; s=int(c['sentences']); cl=int(c['clauses']); ch=int(c['chunks'])
          if c['speeches']!=1164: raise SystemExit(c)

          stage=load('mousetrap_stage_directions.json'); entries=stage['entries']
          total=len(entries); standalone=sum(e['kind']=='scene-setting' for e in entries); attached=sum(e['kind']=='stage-direction' for e in entries)
          actor=sum(bool(e.get('actorCueForSpeech')) for e in entries); malformed=sum(e.get('malformedSourceBracket') is True for e in entries)
          scene_counts=Counter(e['sceneId'] for e in entries); placements=Counter(e.get('placement') for e in entries if e['kind']=='stage-direction')
          expected=(total,standalone,attached,actor,malformed,scene_counts['act1-scene1'],scene_counts['act1-scene2'],scene_counts['act2'],placements['before'],placements['delivery'],placements['after'])
          if expected!=(778,5,773,612,1,185,230,363,236,411,126): raise SystemExit(f'unexpected repaired stage metrics {expected}')
          scene_csv=f"{scene_counts['act1-scene1']},{scene_counts['act1-scene2']},{scene_counts['act2']}"

          patch('app/src/data-store.js',[
            (r'counts\.sentences !== \d+',f'counts.sentences !== {s}'),(r'counts\.clauses !== \d+',f'counts.clauses !== {cl}'),(r'counts\.chunks !== \d+',f'counts.chunks !== {ch}'),
            (r'value\.entries\.length!==\d+',f'value.entries.length!=={total}'),(r'value\.counts\?\.attached!==\d+',f'value.counts?.attached!=={attached}'),(r'value\.counts\?\.total!==\d+',f'value.counts?.total!=={total}'),
            (r'actorCues!==\d+',f'actorCues!=={actor}')])
          patch('app/scripts/assemble-production.mjs',[
            (r'structure\.counts\?\.sentences!==\d+',f'structure.counts?.sentences!=={s}'),(r'structure\.counts\?\.clauses!==\d+',f'structure.counts?.clauses!=={cl}'),(r'structure\.counts\?\.chunks!==\d+',f'structure.counts?.chunks!=={ch}'),
            (r'structureSentences:\d+',f'structureSentences:{s}'),(r'structureClauses:\d+',f'structureClauses:{cl}'),(r'structureChunks:\d+',f'structureChunks:{ch}'),
            (r'stageDirections\.entries\?\.length!==\d+',f'stageDirections.entries?.length!=={total}'),(r'stageDirections\.counts\?\.attached!==\d+',f'stageDirections.counts?.attached!=={attached}'),(r'stageDirections\.counts\?\.total!==\d+',f'stageDirections.counts?.total!=={total}'),
            (r'stageAttached!==\d+',f'stageAttached!=={attached}'),(r'stageActorCues!==\d+',f'stageActorCues!=={actor}'),(r"join\(','\)!=='\d+,\d+,\d+'",f"join(',')!=='{scene_csv}'"),
            (r'stageDirections:\d+',f'stageDirections:{total}'),(r'stageJapaneseParaphrases:\d+',f'stageJapaneseParaphrases:{total}')])
          patch('scripts/validate-stage-directions.mjs',[
            (r"\{id:'act1-scene2',act:1,scene:2,count:336,stageCount:\d+\}",f"{{id:'act1-scene2',act:1,scene:2,count:336,stageCount:{scene_counts['act1-scene2']}}}"),
            (r'stage\.counts\?\.attached!==\d+',f'stage.counts?.attached!=={attached}'),(r'stage\.counts\?\.total!==\d+',f'stage.counts?.total!=={total}'),(r'stage\.entries\.length!==\d+',f'stage.entries.length!=={total}'),
            (r'entries\.length}/\d+',f'entries.length}}/{total}'),(r'attached!==\d+\|\|malformed!==\d+',f'attached!=={attached}||malformed!=={malformed}'),(r'actorCues!==\d+',f'actorCues!=={actor}'),
            (r'placements\.before!==\d+\|\|placements\.delivery!==\d+\|\|placements\.after!==\d+',f"placements.before!=={placements['before']}||placements.delivery!=={placements['delivery']}||placements.after!=={placements['after']}")])
          patch('app/tests/stage_directions_static.mjs',[
            (r'stage\.entries\?\.length!==\d+',f'stage.entries?.length!=={total}'),(r'stage\.counts\?\.attached!==\d+',f'stage.counts?.attached!=={attached}'),(r'stage\.counts\?\.total!==\d+',f'stage.counts?.total!=={total}'),
            (r"join\(','\)!=='\d+,\d+,\d+'",f"join(',')!=='{scene_csv}'"),(r'actorCues!==\d+',f'actorCues!=={actor}'),(r'actor cue count \$\{actorCues\}/\d+',f'actor cue count ${{actorCues}}/{actor}')])
          patch('app/tests/stage_directions.e2e.spec.js',[(r'stageCount:\d+',f'stageCount:{total}')])
          patch('.github/workflows/pages.yml',[
            (r"p\['counts'\]\['sentences'\]==\d+",f"p['counts']['sentences']=={s}"),(r"p\['counts'\]\['clauses'\']==\d+",f"p['counts']['clauses']=={cl}"),(r"p\['counts'\]\['chunks'\']==\d+",f"p['counts']['chunks']=={ch}")])
          patch('materials/000_MATERIAL_INDEX.txt',[
            (r'(?m)^- sentences: \d+$',f'- sentences: {s}'),(r'(?m)^- clauses: \d+$',f'- clauses: {cl}'),(r'(?m)^- chunks: \d+$',f'- chunks: {ch}')])

          manifest=load('data/canonical-integration-manifest.json')
          manifest['schemaVersion']=2; manifest['status']='CHUNKING_V1_CANONICAL'; manifest['productionState']='READY_FOR_MAIN'
          manifest['chunking']['schemaVersion']=2; manifest['chunking']['ruleSet']='chunking-v1'; manifest['chunking']['sourceSha256']=structure['sourceSha256']; manifest['chunking']['structureSha256']=sha('app/mousetrap_line_structure.json'); manifest['chunking']['qaStatus']='PASS'; manifest['chunking']['qaErrorCount']=0; manifest['chunking']['counts']=structure['counts']; manifest['chunking']['sceneStats']=structure['sceneStats']
          dump('data/canonical-integration-manifest.json',manifest)

          contract=load('data/canonical-production-contract.json')
          for item in contract['files']: item['sha256']=sha(item['path'])
          dump('data/canonical-production-contract.json',contract)

          version=load('app/pwa-version.json'); old=version['buildId']; m=re.fullmatch(r'(.+-r)(\d+)',old)
          if not m: raise SystemExit(f'unexpected build id {old}')
          new=m.group(1)+str(int(m.group(2))+1); version['buildId']=new; version['dataVersion']='canonical-2026-09-02-stage-direction-speech-fix-v1'; dump('app/pwa-version.json',version)
          for p in ['app/src/config.js','app/sw.js']:
            text=Path(p).read_text(encoding='utf-8')
            if old not in text: raise SystemExit(f'{p}: old build id absent')
            Path(p).write_text(text.replace(old,new),encoding='utf-8')
          print(json.dumps({'structureCounts':{'sentences':s,'clauses':cl,'chunks':ch},'stage':{'total':total,'attached':attached,'actorCues':actor,'scenes':dict(scene_counts),'placements':dict(placements)},'buildId':new,'scriptSha256':sha('mousetrap_script_data.json'),'structureSha256':sha('app/mousetrap_line_structure.json')},indent=2))
          PY

      - name: Regenerate A2+ candidate lists from corrected spoken text
        run: node scripts/generate-a2plus-candidate-lists.mjs

      - name: Validate canonical and runtime data
        run: |
          node scripts/validate-stage-directions.mjs
          node --check scripts/repair-stage-direction-speech-leakage.mjs
          node --check app/src/data-store.js
          node --check app/scripts/assemble-production.mjs
          cd app
          node tests/stage_directions_static.mjs
          node tests/pdf_pages_static.mjs
          node tests/index_zero_static.mjs
          node tests/offline_pwa_static.mjs
          node scripts/assemble-production.mjs --verify-only

      - name: Assert corrected line and recovered stage cue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('mousetrap_script_data.json','utf8'));
          const rows=Object.values(s).flatMap(x=>x.speeches||[]);
          const t=rows.find(x=>x.id==='act1-scene2-speech-0308');
          if(t?.text!=='Ah.') throw new Error(JSON.stringify(t));
          const bad=rows.filter(x=>/[\[\]{}]/.test(String(x.text||'')));
          if(bad.length) throw new Error(JSON.stringify(bad));
          const st=JSON.parse(fs.readFileSync('mousetrap_stage_directions.json','utf8')).entries.filter(x=>x.malformedSourceBracket===true);
          if(st.length!==1||st[0].text.trim()!=='He moves above the sofa table.'||st[0].speechId!==t.id||st[0].placement!=='after') throw new Error(JSON.stringify(st));
          console.log('spoken/stage separation PASS',t,st[0]);
          NODE

      - name: Commit and push repaired canonical state
        run: |
          git add -A
          git status --short
          git commit -m 'Fix stage direction leaked into Trotter speech [skip repair]'
          git push origin HEAD:repair/stage-direction-speech-leakage
