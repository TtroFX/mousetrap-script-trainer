name: Build Act 2 Interpretation

on:
  push:
    branches: ["feature/interpretation-act2"]
    paths:
      - '.github/workflows/build-interpretation-act2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode canonical Act 2 interpretation
        env:
          PAYLOAD: ''
        run: |
          python - <<'PY'
          import os, base64, lzma
          raw = lzma.decompress(base64.b64decode(os.environ['PAYLOAD']))
          os.makedirs('data/interpretation', exist_ok=True)
          open('data/interpretation/act2.json','wb').write(raw)
          PY
      - name: Validate Act 2 interpretation
        run: node scripts/validate-interpretation-scene.mjs act2
      - name: Commit canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/interpretation/act2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Act 2 interpretation data'
          git push
