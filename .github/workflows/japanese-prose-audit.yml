name: Audit Japanese user-facing prose

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: List untranslated ASCII in translations and interpretation
        run: node scripts/audit-japanese-prose.mjs
