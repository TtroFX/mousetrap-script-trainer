name: Audit Vocabulary Dictionary Style

on:
  push:
    branches:
      - audit/vocabulary-dictionary-style
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-dictionary-style
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dictionary style repairs
        run: node scripts/repair-vocabulary-dictionary-style.mjs
      - name: Audit dictionary style
        run: node scripts/audit-vocabulary-dictionary-style.mjs
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit repaired data and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json data/vocabulary-dictionary-style-audit.json data/vocabulary-dictionary-style-repair-report.json
          if git diff --cached --quiet; then
            echo "No dictionary style changes."
            exit 0
          fi
          git commit -m "Normalize vocabulary dictionary style"
          git push origin HEAD:audit/vocabulary-dictionary-style
