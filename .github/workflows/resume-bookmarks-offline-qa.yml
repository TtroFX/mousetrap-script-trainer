name: Resume Bookmarks Offline QA

on:
  push:
    branches: ["fix/resume-bookmarks-offline"]

permissions:
  contents: read

concurrency:
  group: resume-bookmarks-offline-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Structure
        run: node app/scripts/build-learning-structure.mjs --root . --out app/mousetrap_line_structure.json
      - name: Static and exact artifact QA
        working-directory: app
        run: |
          node --check src/config.js
          node --check src/data-store.js
          node --check src/state-store.js
          node --check src/resume-bookmarks.js
          node --check src/main.js
          node --check sw.js
          node tests/index_zero_static.mjs
          node scripts/assemble-production.mjs --verify-only
          node scripts/assemble-production.mjs --out-dir ../public
      - name: Install Chromium
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run all Chromium QA including offline reload
        working-directory: app
        run: npm run test:e2e
