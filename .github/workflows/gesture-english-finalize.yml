name: Finalize Gesture and English UI
on:
  push:
    branches: ["feature/gesture-controls"]
permissions:
  contents: write
concurrency:
  group: gesture-english-finalize
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply r4 UI and gesture migration
        working-directory: app
        run: |
          python - <<'PY'
          p='scripts/apply-r4-ui-gestures.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const marker='}async function openWordSheet';","const marker='}\\nasync function openWordSheet';")
          open(p,'w',encoding='utf-8').write(s)
          PY
          node scripts/apply-r4-ui-gestures.mjs
          sed -i 's/\.line-page>:scope>\.card/.line-page > .card/g' tests/gesture_english.e2e.spec.js
          sed -i 's/Bookmark一覧/Bookmarks/g' tests/index_zero_static.mjs
          sed -i 's/台本を覚える/Learn Your Lines/g; s/Bookmark一覧/Bookmarks/g' tests/resume_bookmarks.e2e.spec.js
          python - <<'PY'
          p='tests/resume_bookmarks.e2e.spec.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace("getByRole('heading',{name:'Bookmarks'})","getByRole('heading',{name:'Bookmarks',exact:true})")
          open(p,'w',encoding='utf-8').write(s)
          PY
          node --check src/main.js
          node --check src/gesture-controls.js
          node --check src/resume-bookmarks.js
          node --check tests/index_zero_static.mjs
      - name: Build canonical Structure
        run: node app/scripts/build-learning-structure.mjs --root . --out app/mousetrap_line_structure.json
      - name: Static and exact artifact QA
        working-directory: app
        run: |
          node tests/index_zero_static.mjs
          node scripts/assemble-production.mjs --verify-only
          rm -rf ../public
          node scripts/assemble-production.mjs --out-dir ../public
          test -e ../public/src/gesture-controls.js
          grep -q "index-zero-2026-08-26-r4" ../public/pwa-version.json
          ! grep -P '[ぁ-んァ-ヶ一-龠]' index.html offline.html src/main.js src/resume-bookmarks.js
      - name: Install Chromium
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Full Chromium QA
        working-directory: app
        run: npm run test:e2e
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/gesture-english-audit.yml
          rm -f .github/workflows/gesture-english-finalize.yml
          rm -f app/scripts/apply-r4-ui-gestures.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "r4: English UI, gesture controls, and collapsed Structure"
          git push origin HEAD:feature/gesture-controls
