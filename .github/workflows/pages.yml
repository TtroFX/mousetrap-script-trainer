name: Deploy Index Zero PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate committed canonical data
        run: |
          node scripts/validate-vocabulary-semantics.mjs
          python3 -m py_compile app/scripts/validate-chunking-v1.py
          python3 app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report /tmp/chunking-v1-pages-qa.json

      - name: Validate Index Zero architecture
        working-directory: app
        run: |
          node --check src/config.js
          node --check src/data-store.js
          node --check src/state-store.js
          node --check src/main.js
          node --check src/study/structure-model.js
          node --check src/study/structure-view.js
          node --check src/study/dictionary-sheet.js
          node --check sw.js
          node --check scripts/assemble-production.mjs
          node tests/index_zero_static.mjs
          node scripts/assemble-production.mjs --verify-only

      - name: Assemble exact Pages artifact
        run: |
          rm -rf public
          (cd app && node scripts/assemble-production.mjs --out-dir ../public)
          touch public/.nojekyll
          test -e public/index.html
          test -e public/src/main.js
          test -e public/src/study/study.css
          test -e public/src/study/structure-model.js
          test -e public/src/study/structure-view.js
          test -e public/src/study/dictionary-sheet.js
          test -e public/mousetrap_script_data.json
          test -e public/mousetrap_line_interpretation.json
          test -e public/mousetrap_line_structure.json
          python3 - <<'PY'
          import json
          p=json.load(open('public/mousetrap_line_structure.json',encoding='utf-8'))
          assert p['schemaVersion']==2 and p['ruleSet']=='chunking-v1'
          assert p['counts']['speeches']==1164
          assert p['counts']['sentences']==2334
          assert p['counts']['clauses']==2939
          assert p['counts']['chunks']==11810
          assert 'rawLines' not in p
          PY
          test ! -e public/p5_app.js
          test ! -e public/reader_sheet.js
          test ! -e public/practice_navigation.js
          test ! -e public/p6_private_data.js
          test ! -e public/P2_learning.html
          test ! -e public/008_cue_practice_P3.html
          test ! -e public/009_rehearsal_P4.html

      - name: Install Chromium QA
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run full feature-parity QA against exact artifact
        working-directory: app
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
