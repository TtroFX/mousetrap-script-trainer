name: Deploy Index Zero PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate committed canonical data
        run: |
          node scripts/validate-vocabulary-semantics.mjs
          node scripts/validate-stage-directions.mjs
          python3 -m py_compile app/scripts/validate-chunking-v1.py
          python3 app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report /tmp/chunking-v1-pages-qa.json

      - name: Report canonical file hashes
        run: |
          sha256sum mousetrap_script_data.json
          sha256sum mousetrap_line_translations.json
          sha256sum mousetrap_line_vocabulary.json
          sha256sum mousetrap_line_grammar.json
          sha256sum mousetrap_word_dictionary.json

      - name: Validate Index Zero architecture
        working-directory: app
        run: |
          node --check src/config.js
          node --check src/data-store.js
          node --check src/state-store.js
          node --check src/main.js
          node --check src/pdf-pages.js
          node --check src/stage-directions.js
          node --check src/study/structure-model.js
          node --check src/study/structure-view.js
          node --check src/study/dictionary-sheet.js
          node --check sw.js
          node --check scripts/assemble-production.mjs
          node tests/pdf_pages_static.mjs
          npm run test:static
          npm run verify:production

      - name: Assemble exact Pages artifact
        run: |
          rm -rf public
          (cd app && node scripts/assemble-production.mjs --out-dir ../public)
          touch public/.nojekyll
          test -e public/index.html
          test -e public/src/main.js
          test -e public/src/pdf-pages.js
          test -e public/src/pdf-pages.css
          test -e public/src/stage-directions.js
          test -e public/src/stage-directions.css
          test -e public/src/mousetrap_stage_directions.json
          test -e public/src/study/study.css
          test -e public/src/study/structure-model.js
          test -e public/src/study/structure-view.js
          test -e public/src/study/dictionary-sheet.js
          test -e public/sw.js
          test -e public/mousetrap_script_data.json
          test -e public/mousetrap_line_interpretation.json
          test -e public/mousetrap_line_structure.json
          grep -F "from './pdf-pages.js'" public/src/main.js
          grep -F 'data-pdf-page' public/src/main.js
          grep -F "'./src/pdf-pages.js'" public/sw.js
          grep -F "'./src/pdf-pages.css'" public/sw.js
          test ! -e public/src/pdf-page-badges.js
          ! grep -F 'pdf-page-badges.js' public/index.html
          node --input-type=module - <<'NODE'
          import { pageForLine } from './public/src/pdf-pages.js';
          if(pageForLine('act1-scene1-speech-0002')!==2)throw new Error('artifact page mapping mismatch for speech-0002');
          if(pageForLine('act1-scene2-speech-0001')!==19)throw new Error('artifact Scene II page mapping mismatch');
          if(pageForLine('act2-speech-0001')!==43)throw new Error('artifact Act II page mapping mismatch');
          NODE
          python3 - <<'PY'
          import json
          p=json.load(open('public/mousetrap_line_structure.json',encoding='utf-8'))
          assert p['schemaVersion']==2 and p['ruleSet']=='chunking-v1'
          assert p['counts']['speeches']==1164
          assert p['counts']['sentences']==2334
          assert p['counts']['clauses']==2938
          assert p['counts']['chunks']==11807
          assert 'rawLines' not in p
          PY
          test ! -e public/p5_app.js
          test ! -e public/reader_sheet.js
          test ! -e public/practice_navigation.js
          test ! -e public/p6_private_data.js
          test ! -e public/P2_learning.html
          test ! -e public/008_cue_practice_P3.html
          test ! -e public/009_rehearsal_P4.html

      - name: Install Chromium QA
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run full feature-parity QA against exact artifact
        continue-on-error: true
        working-directory: app
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Publish tag and GitHub Release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its immutable target unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "The Mousetrap Script Trainer $TAG" \
            --notes-file RELEASE_NOTES.md
