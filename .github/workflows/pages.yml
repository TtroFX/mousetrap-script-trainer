name: Deploy production PWA to GitHub Pages

on:
  push:
    branches: ["main", "r17-static-data-cleanup"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical learning structure
        run: |
          node --check app/scripts/build-learning-structure.mjs
          node app/scripts/build-learning-structure.mjs --root . --out app/mousetrap_line_structure.json

      - name: Validate static PWA source and startup
        run: |
          node --check app/bootstrap_entry.js
          node --check app/practice_navigation.js
          node --check app/reader_sheet.js
          node --check app/p6_pwa.js
          node --check app/sw.js
          node --check app/tests/startup_smoke.mjs
          (cd app && node tests/p6_static_qa.mjs)
          (cd app && node tests/startup_smoke.mjs)

      - name: Verify canonical repository data
        run: |
          (cd app && node scripts/assemble-production.mjs --verify-only)

      - name: Assemble GitHub Pages artifact
        run: |
          rm -rf public
          (cd app && node scripts/assemble-production.mjs --out-dir ../public)
          touch public/.nojekyll
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const contract=JSON.parse(fs.readFileSync('data/canonical-production-contract.json','utf8'));
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for(const entry of contract.files){const root=sha(entry.path),artifact=sha(`public/${entry.path}`);if(root!==entry.sha256||artifact!==root)throw Error(`artifact SHA mismatch: ${entry.path}`)}
          if(fs.existsSync('public/p6_private_data.js')||fs.existsSync('public/pages_private_import.js')||fs.existsSync('public/bootstrap_watchdog.js'))throw Error('legacy startup runtime leaked into Pages artifact');
          console.log('Pages artifact canonical JSON matches repository root byte-for-byte.');
          NODE

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
