name: Deploy production PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical learning structure
        run: |
          node --check app/scripts/build-learning-structure.mjs
          node app/scripts/build-learning-structure.mjs --root . --out app/mousetrap_line_structure.json

      - name: Validate PWA source
        run: |
          node --check app/pages_private_import.js
          node --check app/reader_sheet.js
          node --check app/sw.js
          (cd app && node tests/p6_static_qa.mjs)

      - name: Verify canonical JSON files from repository root
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const version = JSON.parse(fs.readFileSync('app/pwa-version.json', 'utf8'));
          let failed = false;
          for (const entry of version.canonicalDataFiles) {
            const path = entry.path;
            if (!fs.existsSync(path)) {
              console.error(`::error::Missing canonical JSON at repository root: ${path}`);
              failed = true;
              continue;
            }
            const bytes = fs.readFileSync(path);
            const actual = crypto.createHash('sha256').update(bytes).digest('hex');
            if (actual !== entry.sha256) {
              console.error(`::error::SHA-256 mismatch for ${path}: expected ${entry.sha256}, got ${actual}`);
              failed = true;
            } else {
              console.log(`Verified ${path}`);
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Assemble GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/icons

          runtime=(
            index.html
            p5.css
            p5_app.js
            reader_sheet.js
            p6_private_data.js
            pages_private_import.js
            p6_pwa.css
            p6_pwa.js
            P2_learning.html
            008_cue_practice_P3.html
            009_rehearsal_P4.html
            mousetrap_line_structure.json
            manifest.webmanifest
            pwa-version.json
            offline.html
            sw.js
          )
          canonical=(
            mousetrap_script_data.json
            mousetrap_line_translations.json
            mousetrap_line_vocabulary.json
            mousetrap_line_grammar.json
            mousetrap_word_dictionary.json
          )

          for file in "${runtime[@]}"; do
            test -f "app/$file"
            cp "app/$file" "public/$file"
          done

          for file in "${canonical[@]}"; do
            test -f "$file"
            cp "$file" "public/$file"
          done

          cp app/icons/icon-192.png public/icons/
          cp app/icons/icon-512.png public/icons/
          cp app/icons/icon-maskable-512.png public/icons/
          touch public/.nojekyll

          test -f public/index.html
          test -f public/sw.js
          test -f public/reader_sheet.js
          test -f public/mousetrap_line_structure.json
          for file in "${canonical[@]}"; do test -f "public/$file"; done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
