name: Audit back-half A2+ vocabulary gap

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-back-half-a2plus-gap.mjs'
      - '.github/workflows/audit-back-half-a2plus-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build gap audit
        run: node scripts/audit-back-half-a2plus-gap.mjs
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a2plus-back-half-integration/gap-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit back-half A2+ vocabulary gap"
          git push
