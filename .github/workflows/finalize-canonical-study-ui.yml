name: Finalize Canonical Study UI

on:
  push:
    branches: ["feature/canonical-vocab-structure-ui-v3"]
    paths:
      - 'scripts/finalize-canonical-study-ui.py'
      - '.github/workflows/finalize-canonical-study-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-vocab-structure-ui-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final canonical layout and validation
        run: python3 scripts/finalize-canonical-study-ui.py
      - name: Validate static production contract
        run: |
          node --check app/src/main.js
          node --check app/src/data-store.js
          (cd app && node tests/index_zero_static.mjs)
          (cd app && node scripts/assemble-production.mjs --verify-only)
      - name: Commit final implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main.js app/src/data-store.js
          git commit -m 'Finalize canonical Vocabulary and Structure UI'
          git push
