name: Build Vocabulary Block 3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-vocabulary-block-3.mjs'
      - 'scripts/apply-oxford-review-block-3.mjs'
      - 'scripts/audit-oxford-b1plus-block-3.mjs'
      - 'scripts/validate-vocabulary-block.mjs'
      - 'data/vocabulary-rebuild/block-3-neutral-seed.json'
      - 'data/vocabulary-rebuild/block-3-oxford-review.json'
      - 'data/context-outline-patches/block-3.json'
      - 'data/mousetrap_context_outline.json'
      - '.github/workflows/build-vocabulary-block-3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight neutral dictionary coverage
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const oldVocab=read('mousetrap_line_vocabulary.json');
          const oldDict=read('mousetrap_word_dictionary.json');
          const b1={...(read('data/vocabulary-rebuild/block-1-dictionary.json').entries||{}),...(read('data/vocabulary-rebuild/block-1-dictionary-supplement.json').entries||{})};
          const b2=read('data/vocabulary-rebuild/block-2-dictionary.json').entries||{};
          const seed=read('data/vocabulary-rebuild/block-3-neutral-seed.json').entries||{};
          const missing=new Map();
          for(let n=179;n<=336;n++){
            const id=`act1-scene2-speech-${String(n).padStart(4,'0')}`;
            for(const e of oldVocab[id]||[]){
              const lemma=String(e.lemma||e.surface||'').trim();
              if(!lemma) continue;
              if(b2[lemma]?.meaning||b1[lemma]?.meaning||seed[lemma]?.meaning||oldDict[lemma]?.coreMeaning) continue;
              if(!missing.has(lemma)) missing.set(lemma,[]);
              missing.get(lemma).push({speechId:id,surface:e.surface,legacyMeaning:e.meaning});
            }
          }
          console.log(JSON.stringify({missingCount:missing.size,missing:Object.fromEntries(missing)},null,2));
          EOF
      - name: Build Block 3 vocabulary data
        run: node scripts/build-vocabulary-block-3.mjs
      - name: Apply reviewed Oxford B1+ additions
        run: node scripts/apply-oxford-review-block-3.mjs
      - name: Validate Block 1 regression
        run: node scripts/validate-vocabulary-block.mjs block-1
      - name: Validate Block 2 regression
        run: node scripts/validate-vocabulary-block.mjs block-2
      - name: Validate Block 3 structure
        run: node scripts/validate-vocabulary-block.mjs block-3
      - name: Audit Oxford B1+ candidates strictly
        run: node scripts/audit-oxford-b1plus-block-3.mjs --strict
      - name: Assert zero neutral fallbacks
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/block-3-neutral-fallbacks.json','utf8'));
          console.log(JSON.stringify(f,null,2));
          if(f.count!==0) process.exit(1);
          EOF
      - name: Commit generated Block 3 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocabulary-rebuild/block-3-line-vocabulary.json \
                  data/vocabulary-rebuild/block-3-b1plus-coverage.json \
                  data/vocabulary-rebuild/block-3-dictionary.json \
                  data/vocabulary-rebuild/block-3-dictionary-supplement.json \
                  data/vocabulary-rebuild/block-3-neutral-fallbacks.json \
                  data/vocabulary-rebuild/block-3-oxford-audit.json \
                  data/vocabulary-rebuild/block-3-oxford-application.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate Block 3 vocabulary rebuild'
          git push
