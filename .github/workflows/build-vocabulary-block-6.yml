name: Build Vocabulary Block 6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-vocabulary-block-6.mjs'
      - 'scripts/apply-block-6-neutral-supplement.mjs'
      - 'scripts/apply-block-6-oxford-review.mjs'
      - 'scripts/audit-oxford-b1plus-block-6.mjs'
      - 'scripts/validate-vocabulary-block.mjs'
      - 'scripts/merge-context-outline.mjs'
      - 'data/vocabulary-rebuild/block-6-context-seed.json'
      - 'data/vocabulary-rebuild/block-6-neutral-seed.json'
      - 'data/vocabulary-rebuild/block-6-neutral-supplement.json'
      - 'data/vocabulary-rebuild/block-6-oxford-review.json'
      - 'data/context-outline-patches/block-6.json'
      - '.github/workflows/build-vocabulary-block-6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge context outline in workspace
        run: node scripts/merge-context-outline.mjs
      - name: Build Block 6 vocabulary data
        run: node scripts/build-vocabulary-block-6.mjs
      - name: Apply neutral dictionary supplement
        run: node scripts/apply-block-6-neutral-supplement.mjs
      - name: Apply reviewed Oxford B1+ additions
        run: node scripts/apply-block-6-oxford-review.mjs
      - name: Validate Block 1 regression
        run: node scripts/validate-vocabulary-block.mjs block-1
      - name: Validate Block 2 regression
        run: node scripts/validate-vocabulary-block.mjs block-2
      - name: Validate Block 3 regression
        run: node scripts/validate-vocabulary-block.mjs block-3
      - name: Validate Block 4 regression
        run: node scripts/validate-vocabulary-block.mjs block-4
      - name: Validate Block 5 regression
        run: node scripts/validate-vocabulary-block.mjs block-5
      - name: Validate Block 6 structure
        run: node scripts/validate-vocabulary-block.mjs block-6
      - name: Audit Oxford B1+ candidates strictly
        run: node scripts/audit-oxford-b1plus-block-6.mjs --strict
      - name: Assert zero neutral fallbacks
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/block-6-neutral-fallbacks.json','utf8'));
          console.log(JSON.stringify(f,null,2));
          if (f.count !== 0) process.exit(1);
          EOF
      - name: Commit generated Block 6 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mousetrap_context_outline.json \
                  data/vocabulary-rebuild/block-6-line-vocabulary.json \
                  data/vocabulary-rebuild/block-6-b1plus-coverage.json \
                  data/vocabulary-rebuild/block-6-dictionary.json \
                  data/vocabulary-rebuild/block-6-dictionary-supplement.json \
                  data/vocabulary-rebuild/block-6-neutral-fallbacks.json \
                  data/vocabulary-rebuild/block-6-build-report.json \
                  data/vocabulary-rebuild/block-6-oxford-audit.json \
                  data/vocabulary-rebuild/block-6-oxford-application.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Finalize Block 6 vocabulary rebuild'
          git push
