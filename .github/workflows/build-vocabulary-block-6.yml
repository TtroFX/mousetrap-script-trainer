name: Build Vocabulary Block 6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-quarter-vocabulary.mjs'
      - 'data/final-quarter-vocabulary-patch.seed.*'
      - '.github/workflows/build-vocabulary-block-6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize reviewed final-quarter patch
        shell: bash
        run: |
          set -euo pipefail
          cat data/final-quarter-vocabulary-patch.seed.{01..07} > data/final-quarter-vocabulary-patch.json.gz.b64
      - name: Accommodate pre-existing dictionary punctuation aliases
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const p='scripts/apply-final-quarter-vocabulary.mjs';
          let s=fs.readFileSync(p,'utf8');
          const oldGuard='  if (dictKeyByNorm.has(n)) fail(`Dictionary normalized-key duplicate: ${key} / ${dictKeyByNorm.get(n)}`);\n  dictKeyByNorm.set(n, key);';
          const newGuard='  if (!dictKeyByNorm.has(n)) dictKeyByNorm.set(n, key);';
          if (!s.includes(oldGuard)) throw new Error('Expected dictionary alias guard not found');
          s=s.replace(oldGuard,newGuard);
          const oldMap="const dictionaryByNorm = new Map(Object.entries(dictionary).map(([key, entry]) => [norm(key), entry]));";
          const newMap="const dictionaryByNorm = new Map();\nfor (const [key, entry] of Object.entries(dictionary)) if (!dictionaryByNorm.has(norm(key))) dictionaryByNorm.set(norm(key), entry);\nconst dictionaryByExact = new Map(Object.entries(dictionary).map(([key, entry]) => [String(key).trim().toLowerCase(), entry]));";
          if (!s.includes(oldMap)) throw new Error('Expected dictionary QA map not found');
          s=s.replace(oldMap,newMap);
          const oldLookup='    const dict = dictionaryByNorm.get(norm(lemma));';
          const newLookup="    const dict = dictionary[lemma] || dictionaryByExact.get(String(lemma).trim().toLowerCase()) || dictionaryByNorm.get(norm(lemma));";
          if (!s.includes(oldLookup)) throw new Error('Expected dictionary QA lookup not found');
          s=s.replace(oldLookup,newLookup);
          const oldPair='    const pair = `${norm(surface)}\\u0000${norm(lemma)}`;';
          const newPair='    const pair = `${surface.toLowerCase()}\\u0000${lemma.toLowerCase()}`;';
          if (!s.includes(oldPair)) throw new Error('Expected vocabulary duplicate key not found');
          s=s.replace(oldPair,newPair);
          fs.writeFileSync(p,s);
          EOF
      - name: Apply production vocabulary edit and integrated QA
        run: node scripts/apply-final-quarter-vocabulary.mjs
      - name: Validate Block 1 regression
        run: node scripts/validate-vocabulary-block.mjs block-1
      - name: Validate Block 2 regression
        run: node scripts/validate-vocabulary-block.mjs block-2
      - name: Validate Block 3 regression
        run: node scripts/validate-vocabulary-block.mjs block-3
      - name: Validate Block 4 regression
        run: node scripts/validate-vocabulary-block.mjs block-4
      - name: Validate Block 5 regression
        run: node scripts/validate-vocabulary-block.mjs block-5
      - name: Validate Block 6 regression
        run: node scripts/validate-vocabulary-block.mjs block-6
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify application production contract
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit production vocabulary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mousetrap_line_vocabulary.json \
                  mousetrap_word_dictionary.json \
                  data/canonical-production-contract.json \
                  data/canonical-integration-manifest.json \
                  data/final-quarter-vocabulary-patch.json \
                  data/final-quarter-vocabulary-qa.json \
                  app/scripts/assemble-production.mjs
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize final-quarter production vocabulary'
          git push
