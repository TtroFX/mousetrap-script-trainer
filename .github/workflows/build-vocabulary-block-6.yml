name: Build Vocabulary Block 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vocabulary-block-6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect final-quarter patch schema
        shell: bash
        run: |
          set -euo pipefail
          cat data/final-quarter-vocabulary-patch.seed.{01..07} > data/final-quarter-vocabulary-patch.json.gz.b64
          node --input-type=module <<'EOF'
          import fs from 'node:fs'; import zlib from 'node:zlib';
          const patch=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/final-quarter-vocabulary-patch.json.gz.b64','utf8'),'base64')).toString('utf8'));
          const keys=xs=>[...new Set(xs.flatMap(x=>Object.keys(x||{})))].sort();
          const dictKeys=keys((patch.lineRules||[]).map(x=>x.dictionary));
          const categories=Object.fromEntries([...new Set((patch.lineRules||[]).map(x=>x.category))].sort().map(c=>[c,(patch.lineRules||[]).filter(x=>x.category===c).length]));
          const dictOnlyCats=Object.fromEntries([...new Set((patch.dictionaryOnly||[]).map(x=>x.category))].sort().map(c=>[c,(patch.dictionaryOnly||[]).filter(x=>x.category===c).length]));
          console.log(JSON.stringify({
            schemaVersion:patch.schemaVersion,patchId:patch.patchId,scope:patch.scope,policy:patch.policy,research:patch.research,
            lineRules:(patch.lineRules||[]).length,lineRuleKeys:keys(patch.lineRules||[]),lineDictionaryKeys:dictKeys,categories,
            dictionaryOnly:(patch.dictionaryOnly||[]).length,dictionaryOnlyKeys:keys(patch.dictionaryOnly||[]),dictionaryOnlyDictionaryKeys:keys((patch.dictionaryOnly||[]).map(x=>x.dictionary)),dictOnlyCats,
            samples:{firstRule:patch.lineRules?.[0],midRule:patch.lineRules?.[Math.floor((patch.lineRules?.length||1)/2)],lastRule:patch.lineRules?.at(-1),firstDictionaryOnly:patch.dictionaryOnly?.[0],lastDictionaryOnly:patch.dictionaryOnly?.at(-1)}
          },null,2));
          EOF
          exit 1
