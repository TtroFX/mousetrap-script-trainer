name: Temporary integrate vocabulary 0583-0873

on:
  push:
    branches:
      - 'feature/integrate-vocab-0583-0873'
    paths:
      - '.github/workflows/tmp-integrate-vocab-0583-0873.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge verified range into current main baseline
        run: |
          git fetch origin feature/vocab-range-0583-0873:refs/remotes/origin/feature/vocab-range-0583-0873
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const show=p=>JSON.parse(execFileSync('git',['show',`origin/feature/vocab-range-0583-0873:${p}`],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const norm=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
          const rowKey=e=>`${norm(e.surface)}\u0000${norm(e.lemma)}`;
          const fail=m=>{throw new Error(m)};

          const baseV=read('mousetrap_line_vocabulary.json');
          const baseD=read('mousetrap_word_dictionary.json');
          const vocab=JSON.parse(JSON.stringify(baseV));
          const dict=JSON.parse(JSON.stringify(baseD));
          const manifest=read('data/canonical-integration-manifest.json');
          const rangeV=show('mousetrap_line_vocabulary.json');
          const rangeD=show('mousetrap_word_dictionary.json');
          const report=show('data/vocabulary-rebuild/range-0583-0873-production-report.json');
          const ids=Array.from({length:291},(_,i)=>`act2-speech-${String(i+57).padStart(4,'0')}`);
          const idSet=new Set(ids);
          if(ids[0]!=='act2-speech-0057'||ids.at(-1)!=='act2-speech-0347')fail('range boundary');
          if(Object.keys(baseV).length!==1164)fail('baseline speech coverage '+Object.keys(baseV).length);

          for(const id of ids){
            if(!Array.isArray(rangeV[id]))fail('source range missing '+id);
            vocab[id]=JSON.parse(JSON.stringify(rangeV[id]));
          }
          for(const [id,rows] of Object.entries(baseV)){
            if(!idSet.has(id)&&JSON.stringify(vocab[id])!==JSON.stringify(rows))fail('out-of-scope mutation '+id);
          }

          const dictByKey=new Map(Object.entries(dict).map(([k,d])=>[norm(k),{key:k,d}]));
          const rangeByKey=new Map(Object.entries(rangeD).map(([k,d])=>[norm(k),{key:k,d}]));
          for(const id of ids){
            for(const row of vocab[id]){
              const lk=norm(row.lemma);
              let rec=dictByKey.get(lk);
              if(!rec){
                const src=rangeByKey.get(lk);if(!src)fail('range dictionary missing '+row.lemma);
                if(Object.prototype.hasOwnProperty.call(dict,src.key))fail('dictionary key collision '+src.key);
                dict[src.key]=JSON.parse(JSON.stringify(src.d));
                rec={key:src.key,d:dict[src.key]};dictByKey.set(lk,rec);
              }
              row.meaning=rec.d.meaning;
            }
          }

          const baseDictEntries=Object.entries(baseD);
          for(const [k,d] of baseDictEntries){
            if(JSON.stringify(dict[k])!==JSON.stringify(d))fail('existing dictionary mutated '+k);
          }

          let total=0,annotated=0,inThisPlay=0,playMeaning=0;
          const refs=new Set();
          for(const [id,rows] of Object.entries(vocab)){
            if(!Array.isArray(rows))fail('invalid rows '+id);
            if(rows.length)annotated++;
            const seen=new Set();
            for(const row of rows){
              total++;if(row.playMeaning===true)playMeaning++;if('inThisPlay'in row)inThisPlay++;
              const lk=norm(row.lemma);refs.add(lk);
              const rec=dictByKey.get(lk);if(!rec)fail('missing dictionary '+row.lemma);
              if(String(row.meaning||'').trim()!==String(rec.d.meaning||'').trim())fail('meaning mismatch '+id+' '+row.lemma);
              if(idSet.has(id)){const k=rowKey(row);if(seen.has(k))fail('target duplicate '+id+' '+k);seen.add(k);}
            }
          }
          if(Object.keys(vocab).length!==1164)fail('final speech coverage '+Object.keys(vocab).length);

          let baseTargetItems=0,targetItems=0,targetAnnotated=0,targetContext=0,stageDirectionEntries=0;
          let multiWordExpressions=0,polyContext=0;const proper=new Set();
          const baseDictKeySet=new Set(Object.keys(baseD).map(norm));
          for(const id of ids){
            const before=baseV[id]||[],after=vocab[id]||[];
            baseTargetItems+=before.length;targetItems+=after.length;if(after.length)targetAnnotated++;
            targetContext+=after.filter(e=>'inThisPlay'in e).length;
            stageDirectionEntries+=after.filter(e=>e.category==='stage').length;
            const beforeKeys=new Set(before.map(rowKey));
            for(const row of after){
              const rec=dictByKey.get(norm(row.lemma));
              if(!beforeKeys.has(rowKey(row))&&/\s/.test(String(row.lemma||'').trim()))multiWordExpressions++;
              if(rec&&String(rec.d.pos||'').includes('固有名詞'))proper.add(norm(row.lemma));
              if('inThisPlay'in row&&rec){const tags=(rec.d.tags||[]).map(norm);if(tags.some(t=>['polysemy','context','dated-sense'].includes(t))||/[①②③]/.test(String(rec.d.meaning||'')))polyContext++;}
            }
          }
          const newDictionaryEntries=Object.keys(dict).filter(k=>!baseDictKeySet.has(norm(k))).length;

          write('mousetrap_line_vocabulary.json',vocab);
          write('mousetrap_word_dictionary.json',dict);

          report.status='PASS';report.qa='PASS';
          report.integration={baseMainSha:process.env.GITHUB_SHA,sourceRangeCommit:'dabb6ed',strategy:'replace target speech rows; preserve all main dictionary entries; add only missing exact-key lemmas; align target row meaning to main dictionary when reused'};
          report.metrics={...report.metrics,newVocabulary:targetItems-baseTargetItems,newDictionaryEntries,modifiedExistingEntries:0,properNouns:proper.size,multiWordExpressions,stageDirectionEntries,polysemousWithInThisPlay:polyContext,targetSpeechesChecked:291,stageDirectionsAudited:157,stageDirectionsMapped:157};
          report.targetBefore={items:baseTargetItems,annotated:ids.filter(id=>(baseV[id]||[]).length).length,inThisPlay:ids.reduce((n,id)=>n+(baseV[id]||[]).filter(e=>'inThisPlay'in e).length,0)};
          report.targetAfter={items:targetItems,annotated:targetAnnotated,inThisPlay:targetContext};
          report.productionTotals={vocabularyItems:total,annotatedSpeeches:annotated,dictionaryEntries:Object.keys(dict).length,referencedLemmas:refs.size,inThisPlayItems:inThisPlay};
          report.audits={...report.audits,jsonParse:'PASS',schema:'PASS',duplicateCheck:'PASS',missingReferenceCheck:'PASS',speechIdCheck:'PASS',targetBoundaryCheck:'PASS',outOfScopeLineMutationCheck:'PASS',semanticSeparationCheck:'PASS',stageDirectionMapping:'PASS',stageDirectionsWithoutLexicalMatch:0};
          report.stageDirectionsWithoutLexicalMatch=[];report.unresolvedItems=[];
          report.changedFiles=['mousetrap_line_vocabulary.json','mousetrap_word_dictionary.json','data/canonical-integration-manifest.json','data/vocabulary-rebuild/range-0583-0873-production-report.json'];
          report.metricDefinitions={newVocabulary:'target final row count minus current-main target baseline row count',newDictionaryEntries:'final dictionary exact keys absent from current-main baseline',modifiedExistingEntries:'current-main dictionary entries changed in place (must be zero)',properNouns:'unique proper-noun lemmas referenced in final target range',multiWordExpressions:'new target vocabulary rows whose lemma contains whitespace',stageDirectionEntries:'final target rows explicitly marked category=stage',polysemousWithInThisPlay:'final target rows with inThisPlay whose dictionary entry is contextual/polysemous'};
          report.hashes={lineVocabulary:sha('mousetrap_line_vocabulary.json'),wordDictionary:sha('mousetrap_word_dictionary.json')};
          write('data/vocabulary-rebuild/range-0583-0873-production-report.json',report);

          const lv=manifest.studyAssets.lineVocabulary;
          lv.sha256=report.hashes.lineVocabulary;lv.coverageSpeechIds=Object.keys(vocab).length;lv.items=total;lv.annotatedSpeeches=annotated;lv.playMeaningItems=playMeaning;lv.neutralOnlyItems=total-playMeaning;lv.inThisPlayItems=inThisPlay;
          const wd=manifest.studyAssets.wordDictionary;
          wd.sha256=report.hashes.wordDictionary;wd.entries=Object.keys(dict).length;wd.referencedLemmas=refs.size;
          write('data/canonical-integration-manifest.json',manifest);

          console.log(JSON.stringify({status:'PASS',range:[ids[0],ids.at(-1)],metrics:report.metrics,targetBefore:report.targetBefore,targetAfter:report.targetAfter,totals:report.productionTotals,hashes:report.hashes},null,2));
          NODE
      - name: Validate integrated production data
        run: |
          node scripts/validate-vocabulary-semantics.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/range-0583-0873-production-report.json','utf8'));
          if(r.status!=='PASS'||r.qa!=='PASS')throw new Error('report not PASS');
          if(r.metrics.targetSpeechesChecked!==291)throw new Error('speech QA mismatch');
          if(r.metrics.stageDirectionsAudited!==157||r.metrics.stageDirectionsMapped!==157)throw new Error('stage mapping mismatch');
          if(r.audits.stageDirectionsWithoutLexicalMatch!==0)throw new Error('stage lexical coverage incomplete');
          if((r.unresolvedItems||[]).length)throw new Error('unresolved items remain');
          if(r.metrics.modifiedExistingEntries!==0)throw new Error('main dictionary mutation detected');
          for(const k of ['jsonParse','schema','duplicateCheck','missingReferenceCheck','speechIdCheck','targetBoundaryCheck','outOfScopeLineMutationCheck','semanticSeparationCheck','stageDirectionMapping'])if(r.audits[k]!=='PASS')throw new Error(`audit ${k}=${r.audits[k]}`);
          NODE
          git diff --check
      - name: Commit verified integration and remove runner
        run: |
          rm -f .github/workflows/tmp-integrate-vocab-0583-0873.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate vocabulary for Global Speech 583-873'
          git push
