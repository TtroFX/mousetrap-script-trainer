name: Audit front-half A2+ definition sources

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-front-half-a2plus-definition-sources.mjs'
      - '.github/workflows/audit-front-half-a2plus-definition-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit definition sources
        run: node scripts/audit-front-half-a2plus-definition-sources.mjs
      - name: Verify production vocabulary is untouched
        run: |
          git diff --exit-code -- mousetrap_word_dictionary.json mousetrap_line_vocabulary.json mousetrap_script_data.json
          test -s data/a2plus-front-half-integration/source-audit.json
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a2plus-front-half-integration/source-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit front-half A2+ definition sources"
          git push
