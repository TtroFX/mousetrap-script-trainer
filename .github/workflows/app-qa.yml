name: Apply Canonical Relation Runtime Fix

on:
  push:
    branches: ['feature/study-ui-rebuild-v2']
    paths:
      - 'scripts/fix-canonical-relation-runtime-v2.mjs'
      - '.github/workflows/app-qa.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-ui-rebuild-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align relation semantics with canonical validator
        run: |
          node scripts/fix-canonical-relation-runtime-v2.mjs
          rm scripts/fix-canonical-relation-runtime-v2.mjs
          node --check app/src/data-store.js
          node --check app/src/study/structure-model.js
          python3 app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report /tmp/chunking-relation-fix.json
          (cd app && node tests/index_zero_static.mjs && node scripts/assemble-production.mjs --verify-only)
      - name: Commit canonical runtime correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/data-store.js app/src/study/structure-model.js app/tests/index_zero_static.mjs scripts/fix-canonical-relation-runtime-v2.mjs
          git commit -m 'Align Structure relation runtime with canonical chunking validator'
          git push origin HEAD:feature/study-ui-rebuild-v2
