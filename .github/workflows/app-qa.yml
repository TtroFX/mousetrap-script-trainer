name: Apply Study Validator Fix

on:
  push:
    branches: ['feature/study-ui-rebuild-v2']
    paths:
      - 'scripts/fix-study-validator-v2.mjs'
      - '.github/workflows/app-qa.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-ui-rebuild-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical validator correction
        run: |
          if [ -f scripts/fix-study-validator-v2.mjs ]; then
            node scripts/fix-study-validator-v2.mjs
            rm -f scripts/fix-study-validator-v2.mjs scripts/rebuild-study-ui-v2.mjs
          fi
          node --check app/src/data-store.js
      - name: Commit correction and remove one-time migrations
        run: |
          if git diff --quiet; then
            echo 'No correction required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/data-store.js scripts/fix-study-validator-v2.mjs scripts/rebuild-study-ui-v2.mjs
          git commit -m 'Fix canonical Structure runtime validation and remove migrations'
          git push origin HEAD:feature/study-ui-rebuild-v2
