name: App Production QA

on:
  push:
    branches-ignore: ['main']
    paths:
      - 'scripts/rebuild-study-ui-v2.mjs'
      - '.github/workflows/app-qa.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-ui-rebuild-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply study UI rebuild when migration is present
        run: |
          if [ ! -f scripts/rebuild-study-ui-v2.mjs ]; then
            echo 'Migration script not present yet.'
            exit 0
          fi
          node scripts/rebuild-study-ui-v2.mjs
      - name: Validate generated source before commit
        run: |
          node --check app/src/main.js
          node --check app/src/data-store.js
          node --check app/src/study/structure-model.js
          node --check app/src/study/structure-view.js
          node --check app/src/study/dictionary-sheet.js
          node --check app/sw.js
          node --check app/scripts/assemble-production.mjs
          python3 app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report /tmp/chunking-rebuild.json
          (cd app && node tests/index_zero_static.mjs && node scripts/assemble-production.mjs --verify-only)
      - name: Commit rebuilt study UI
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild canonical study presentation'
          git push origin HEAD:feature/study-ui-rebuild-v2
