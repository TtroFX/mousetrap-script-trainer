name: Audit Vocabulary Context Precision

on:
  push:
    branches:
      - audit/vocabulary-context-precision
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-context-precision
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit context precision
        run: node scripts/audit-vocabulary-context-precision.mjs
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocabulary-context-precision-audit.json
          if git diff --cached --quiet; then
            echo "No context audit report changes."
            exit 0
          fi
          git commit -m "Record vocabulary context precision audit"
          git push origin HEAD:audit/vocabulary-context-precision
