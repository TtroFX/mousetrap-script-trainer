name: Audit Vocabulary Context Precision

on:
  push:
    branches:
      - audit/vocabulary-context-precision
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocabulary-context-precision
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply context precision repairs
        run: node scripts/repair-vocabulary-context-precision.mjs
      - name: Audit context precision
        run: node scripts/audit-vocabulary-context-precision.mjs
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Verify production assembly
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only
      - name: Commit repaired data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json data/vocabulary-context-precision-audit.json data/vocabulary-context-precision-repair-report.json
          if git diff --cached --quiet; then
            echo "No context precision changes."
            exit 0
          fi
          git commit -m "Normalize vocabulary context precision"
          git push origin HEAD:audit/vocabulary-context-precision
