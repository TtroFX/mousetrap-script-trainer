name: One-shot Japanese prose cleanup

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fix-japanese-prose.mjs"
      - ".github/workflows/fix-japanese-prose.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check cleanup script syntax
        run: node --check scripts/fix-japanese-prose.mjs

      - name: Apply complete Japanese prose cleanup
        run: node scripts/fix-japanese-prose.mjs

      - name: Verify no accidental English remains
        run: node scripts/audit-japanese-prose.mjs

      - name: Validate affected production data
        run: |
          node scripts/validate-vocabulary-semantics.mjs
          node scripts/validate-stage-directions.mjs
          (cd app && npm run test:static)
          (cd app && npm run verify:production)

      - name: Commit fixed data and remove one-shot workflow
        run: |
          rm .github/workflows/fix-japanese-prose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes produced" >&2; exit 1; }
          git commit -m "fix: fully localize Japanese explanatory prose"
          git push origin HEAD:main
