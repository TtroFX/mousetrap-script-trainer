name: Chunking v1 QA

on:
  push:
    branches: ["feature/chunking-rules-v1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned parser
        run: |
          python -m pip install --disable-pip-version-check "click==8.3.1" "spacy==3.8.11"
          python -m pip install --disable-pip-version-check "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Remove all retired structural material
        run: |
          rm -f app/scripts/build-learning-structure.mjs
          rm -f app/scripts/README_STRUCTURE_BUILDER.md
          rm -f materials/001_*.txt
          rm -f materials/002*.txt
          rm -f materials/003*.txt
          rm -f materials/009_MEMORY_UNITS.txt
          rm -f materials/010_FINAL_MATERIAL_QA.txt
          test ! -e app/scripts/build-learning-structure.mjs
          test ! -e app/scripts/README_STRUCTURE_BUILDER.md
          if find materials -maxdepth 1 -type f \( -name '001_*' -o -name '002*' -o -name '003*' -o -name '009_MEMORY_UNITS.txt' -o -name '010_FINAL_MATERIAL_QA.txt' \) | grep -q .; then
            echo 'retired structural material still exists' >&2
            exit 1
          fi

      - name: Syntax check
        run: |
          python -m py_compile app/scripts/build-chunking-v1.py
          python -m py_compile app/scripts/chunking-v1-runtime.py
          python -m py_compile app/scripts/validate-chunking-v1.py
          python -m py_compile app/scripts/test-chunking-v1.py
          node --check app/src/data-store.js
          node --check app/scripts/assemble-production.mjs

      - name: Rule smoke tests
        run: python app/scripts/test-chunking-v1.py

      - name: Build canonical chunking v1 JSON
        run: |
          rm -f app/mousetrap_line_structure.json data/chunking-v1-qa.json
          python app/scripts/chunking-v1-runtime.py --root . --out app/mousetrap_line_structure.json --model en_core_web_sm
          cp app/mousetrap_line_structure.json /tmp/chunking-v1-first.json

      - name: Strict structural validation
        run: python app/scripts/validate-chunking-v1.py --root . --structure app/mousetrap_line_structure.json --report data/chunking-v1-qa.json

      - name: Deterministic rebuild check
        run: |
          python app/scripts/chunking-v1-runtime.py --root . --out /tmp/chunking-v1-second.json --model en_core_web_sm
          cmp /tmp/chunking-v1-first.json /tmp/chunking-v1-second.json
          sha256sum /tmp/chunking-v1-first.json /tmp/chunking-v1-second.json

      - name: Assert canonical schema and no legacy fallback
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re
          s_path=pathlib.Path('app/mousetrap_line_structure.json')
          q_path=pathlib.Path('data/chunking-v1-qa.json')
          m_path=pathlib.Path('data/canonical-integration-manifest.json')
          p=json.loads(s_path.read_text(encoding='utf-8'))
          q=json.loads(q_path.read_text(encoding='utf-8'))
          m=json.loads(m_path.read_text(encoding='utf-8'))
          assert p['schemaVersion']==2 and p['ruleSet']=='chunking-v1'
          assert p['counts']['speeches']==1164
          assert p['counts']['sentences']==2334
          assert p['counts']['clauses']==2939
          assert p['counts']['chunks']==11810
          assert len(p['lines'])==1164 and 'rawLines' not in p
          assert q['status']=='PASS' and q['errorCount']==0
          digest=hashlib.sha256(s_path.read_bytes()).hexdigest()
          assert digest=='dc1d24c4fe04f23106fd2d8aa1c799ae140f4d8c641149135244237c422e71dd', digest
          assert m['schemaVersion']==2 and m['chunking']['structureSha256']==digest
          assert m['chunking']['counts']['sentences']==2334
          assert m['chunking']['counts']['clauses']==2939
          assert m['chunking']['counts']['chunks']==11810
          bad=[]
          for lid,line in p['lines'].items():
            for sentence in line['sentences']:
              for chunk in sentence['chunks']:
                marker=chunk['marker']
                if marker.startswith('Vi') or marker.startswith('Vt') or 'VBN' in marker or re.match(r'^HV\d',marker):
                  bad.append((lid,marker))
          assert not bad, bad[:10]
          print('canonical chunking v1 assertions: PASS', digest)
          PY

      - name: Assert retired constants and builder are absent from production authority
        run: |
          test ! -e app/scripts/build-learning-structure.mjs
          test ! -e app/scripts/README_STRUCTURE_BUILDER.md
          if grep -R -n -E '2277|8055|schemaVersion[^0-9]*1.*structure|build-learning-structure' \
            app/src/data-store.js app/scripts/assemble-production.mjs data/canonical-integration-manifest.json materials/000_MATERIAL_INDEX.txt .github/workflows/pages.yml; then
            echo 'retired structural authority reference found' >&2
            exit 1
          fi

      - name: Verify production assembly accepts only chunking v1
        working-directory: app
        run: node scripts/assemble-production.mjs --verify-only

      - name: Commit canonical JSON QA and deletions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/mousetrap_line_structure.json data/chunking-v1-qa.json app/scripts materials
          if git diff --cached --quiet; then
            echo 'No generated/deletion changes to commit.'
          else
            git commit -m 'Publish canonical chunking v1 and remove retired structure data [skip ci]'
            git push origin HEAD:feature/chunking-rules-v1
          fi

      - name: Final repository-state assertion
        run: |
          git status --short
          test -e app/mousetrap_line_structure.json
          test -e data/chunking-v1-qa.json
          test ! -e app/scripts/build-learning-structure.mjs
          if find materials -maxdepth 1 -type f \( -name '001_*' -o -name '002*' -o -name '003*' -o -name '009_MEMORY_UNITS.txt' -o -name '010_FINAL_MATERIAL_QA.txt' \) | grep -q .; then exit 1; fi
