name: Vocabulary Block QA

on:
  push:
    paths:
      - 'data/vocabulary-rebuild/**'
      - 'data/mousetrap_context_outline.json'
      - 'scripts/validate-vocabulary-block.mjs'
      - '.github/workflows/block-vocabulary-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Block 1 vocabulary rebuild
        run: node scripts/validate-vocabulary-block.mjs block-1

  block-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Block 2 vocabulary rebuild
        run: node scripts/validate-vocabulary-block.mjs block-2
