name: Apply Canonical Vocabulary and Structure UI

on:
  push:
    branches: ["feature/canonical-vocab-structure-ui-v3"]
    paths:
      - 'scripts/apply-canonical-vocab-structure-ui.py'
      - '.github/workflows/apply-canonical-vocab-structure-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-vocab-structure-ui-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical data/UI migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-canonical-vocab-structure-ui.py')
          s=p.read_text(encoding='utf-8')
          old='new,n=re.subn(pattern,repl,text,count=1,flags=re.S)'
          new='new,n=re.subn(pattern,lambda _match: repl,text,count=1,flags=re.S)'
          if s.count(old)!=1:
              raise SystemExit('regex helper patch target mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 scripts/apply-canonical-vocab-structure-ui.py
      - name: Validate syntax and production contract
        run: |
          node --check app/src/config.js
          node --check app/src/data-store.js
          node --check app/src/main.js
          node --check app/sw.js
          node --check app/scripts/assemble-production.mjs
          (cd app && node tests/index_zero_static.mjs)
          (cd app && node scripts/assemble-production.mjs --verify-only)
      - name: Commit canonical implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mousetrap_line_vocabulary.json data app
          git commit -m 'Align Vocabulary and Structure UI with canonical JSON rules'
          git push
