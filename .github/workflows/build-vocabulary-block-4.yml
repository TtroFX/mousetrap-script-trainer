name: Build Vocabulary Block 4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-vocabulary-block-4.mjs'
      - 'scripts/apply-oxford-review-block-4.mjs'
      - 'scripts/audit-oxford-b1plus-block-4.mjs'
      - 'scripts/validate-vocabulary-block.mjs'
      - 'data/vocabulary-rebuild/block-4-neutral-seed.json'
      - 'data/vocabulary-rebuild/block-4-oxford-review.json'
      - 'data/context-outline-patches/block-4.json'
      - 'data/mousetrap_context_outline.json'
      - '.github/workflows/build-vocabulary-block-4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Block 4 vocabulary data
        run: node scripts/build-vocabulary-block-4.mjs
      - name: Apply reviewed Oxford B1+ additions
        run: node scripts/apply-oxford-review-block-4.mjs
      - name: Validate Block 1 regression
        run: node scripts/validate-vocabulary-block.mjs block-1
      - name: Validate Block 2 regression
        run: node scripts/validate-vocabulary-block.mjs block-2
      - name: Validate Block 3 regression
        run: node scripts/validate-vocabulary-block.mjs block-3
      - name: Validate Block 4 structure
        run: node scripts/validate-vocabulary-block.mjs block-4
      - name: Audit Oxford B1+ candidates strictly
        run: node scripts/audit-oxford-b1plus-block-4.mjs --strict
      - name: Assert zero neutral fallbacks
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/block-4-neutral-fallbacks.json','utf8'));
          console.log(JSON.stringify(f,null,2));
          if(f.count!==0) process.exit(1);
          EOF
      - name: Commit generated Block 4 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocabulary-rebuild/block-4-line-vocabulary.json \
                  data/vocabulary-rebuild/block-4-b1plus-coverage.json \
                  data/vocabulary-rebuild/block-4-dictionary.json \
                  data/vocabulary-rebuild/block-4-dictionary-supplement.json \
                  data/vocabulary-rebuild/block-4-neutral-fallbacks.json \
                  data/vocabulary-rebuild/block-4-oxford-audit.json \
                  data/vocabulary-rebuild/block-4-oxford-application.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate Block 4 vocabulary rebuild'
          git push
