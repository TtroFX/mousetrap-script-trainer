name: Apply first-quarter noun expansion v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-first-quarter-noun-expansion-v2.mjs'
      - 'data/first-quarter-noun-expansion-v2/**'
      - '.github/workflows/first-quarter-noun-expansion-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove obsolete fixed-count rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-first-quarter-noun-expansion-v2.mjs')
          s = p.read_text()
          start_marker = "let assembler = fs.readFileSync(abs(FILES.assembler), 'utf8');"
          end_marker = "fs.writeFileSync(abs(FILES.assembler), assembler);"
          start = s.find(start_marker)
          end = s.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Unable to locate obsolete fixed-count rewrite code')
          end += len(end_marker)
          s = s[:start] + "// The production assembler validates vocabulary counts dynamically; no generated count constant needs rewriting." + s[end:]
          p.write_text(s)
          PY

      - name: Apply expansion and run canonical QA
        run: node scripts/apply-first-quarter-noun-expansion-v2.mjs

      - name: Commit verified generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply-first-quarter-noun-expansion-v2.mjs \
            mousetrap_line_vocabulary.json \
            mousetrap_word_dictionary.json \
            data/canonical-production-contract.json \
            data/canonical-integration-manifest.json \
            data/first-quarter-noun-expansion-v2-qa.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Expand first-quarter vocabulary with everyday nouns"
          git push
