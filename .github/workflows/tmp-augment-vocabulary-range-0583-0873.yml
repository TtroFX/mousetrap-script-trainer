name: Temporary vocabulary range augmentation

on:
  push:
    branches:
      - 'feature/vocab-range-0583-0873*'
    paths:
      - '.github/workflows/tmp-augment-vocabulary-range-0583-0873.yml'

permissions:
  contents: write

jobs:
  augment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve baseline and run augmentation
        run: |
          cp mousetrap_line_vocabulary.json /tmp/range-vocab-baseline.json
          cp mousetrap_word_dictionary.json /tmp/range-dict-baseline.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='scripts/augment-vocabulary-range-0583-0873-wrapper.mjs';
          let s=fs.readFileSync(p,'utf8');
          const before=s;
          s=s.replace(/const _oldLemmas=.*?metrics\.newVocabulary=.*?;\\n/,'');
          if(s===before) throw new Error('temporary metric line not found');
          const hook="const temp='scripts/.tmp-vocab-range-0583-0873.inner.mjs';";
          const inject="source=source.replace('if (semanticErrors.length) fail(`semantic errors ${semanticErrors.length}`);', \"if (semanticErrors.length) console.log('INNER_SEMANTIC_ERRORS=' + JSON.stringify(semanticErrors));\");\n";
          if(!s.includes(hook)) throw new Error('inner semantic hook not found');
          s=s.replace(hook,inject+hook);
          fs.writeFileSync(p,s);
          NODE
          node scripts/augment-vocabulary-range-0583-0873-wrapper.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=JSON.parse(fs.readFileSync('/tmp/range-vocab-baseline.json','utf8'));
          const out=JSON.parse(fs.readFileSync('mousetrap_line_vocabulary.json','utf8'));
          const target=new Set(Array.from({length:291},(_,i)=>`act2-speech-${String(i+57).padStart(4,'0')}`));
          for(const [id,rows] of Object.entries(base)) if(!target.has(id)) out[id]=rows;
          for(const id of Object.keys(out)) if(!target.has(id) && !(id in base)) throw new Error(`unexpected out-of-scope speech ${id}`);
          fs.writeFileSync('mousetrap_line_vocabulary.json',JSON.stringify(out,null,2)+'\n');
          NODE
          node scripts/postprocess-vocabulary-range-0583-0873.mjs
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Parse generated JSON and strict range QA
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const p of [
            'mousetrap_line_vocabulary.json',
            'mousetrap_word_dictionary.json',
            'data/canonical-integration-manifest.json',
            'data/vocabulary-rebuild/range-0583-0873-production-report.json'
          ]) JSON.parse(fs.readFileSync(p, 'utf8'));
          const r=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/range-0583-0873-production-report.json','utf8'));
          if (r.qa !== 'PASS' || r.status !== 'PASS') throw new Error('report not PASS');
          if (r.metrics.targetSpeechesChecked !== 291) throw new Error('target speech count mismatch');
          if (r.metrics.stageDirectionsAudited !== 157 || r.metrics.stageDirectionsMapped !== 157) throw new Error('stage audit mismatch');
          if (r.audits.stageDirectionsWithoutLexicalMatch !== 0) throw new Error('stage lexical coverage incomplete');
          if ((r.unresolvedItems||[]).length) throw new Error('unresolved items remain');
          for (const k of ['jsonParse','schema','duplicateCheck','missingReferenceCheck','speechIdCheck','targetBoundaryCheck','outOfScopeLineMutationCheck','semanticSeparationCheck','stageDirectionMapping']) if(r.audits[k]!=='PASS') throw new Error(`audit ${k}=${r.audits[k]}`);
          console.log(JSON.stringify(r, null, 2));
          NODE
          git diff --check
      - name: Commit production augmentation and remove temporary runner
        run: |
          rm -f scripts/augment-vocabulary-range-0583-0873-wrapper.mjs \
                scripts/postprocess-vocabulary-range-0583-0873.mjs \
                scripts/.tmp-vocab-range-0583-0873.payload.1 \
                scripts/.tmp-vocab-range-0583-0873.payload.2 \
                scripts/.tmp-vocab-range-0583-0873.payload.3 \
                scripts/.tmp-vocab-range-0583-0873.payload.4 \
                .github/workflows/tmp-augment-vocabulary-range-0583-0873.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Augment vocabulary for Global Speech 583-873'
          git push
