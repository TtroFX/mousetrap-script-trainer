name: Temporary vocabulary range augmentation

on:
  push:
    branches: [feature/vocab-range-0583-0873]
    paths:
      - '.github/workflows/tmp-augment-vocabulary-range-0583-0873.yml'

permissions:
  contents: write

jobs:
  augment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and run augmentation
        run: node scripts/augment-vocabulary-range-0583-0873-wrapper.mjs
      - name: Validate vocabulary semantics
        run: node scripts/validate-vocabulary-semantics.mjs
      - name: Parse generated JSON and diff-check
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const p of [
            'mousetrap_line_vocabulary.json',
            'mousetrap_word_dictionary.json',
            'data/canonical-integration-manifest.json',
            'data/vocabulary-rebuild/range-0583-0873-production-report.json'
          ]) JSON.parse(fs.readFileSync(p, 'utf8'));
          const r=JSON.parse(fs.readFileSync('data/vocabulary-rebuild/range-0583-0873-production-report.json','utf8'));
          if (r.qa !== 'PASS') throw new Error(`report QA is ${r.qa}`);
          console.log(JSON.stringify(r, null, 2));
          NODE
          git diff --check
      - name: Commit production augmentation and remove temporary runner
        run: |
          rm -f scripts/augment-vocabulary-range-0583-0873-wrapper.mjs \
                scripts/.tmp-vocab-range-0583-0873.payload.1 \
                scripts/.tmp-vocab-range-0583-0873.payload.2 \
                scripts/.tmp-vocab-range-0583-0873.payload.3 \
                scripts/.tmp-vocab-range-0583-0873.payload.4 \
                .github/workflows/tmp-augment-vocabulary-range-0583-0873.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Augment vocabulary for Global Speech 583-873'
          git push
