name: Review Interpretations Truth Aware

on:
  push:
    branches: ["feature/review-all-interpretations-truth-aware"]
    paths:
      - 'scripts/review-interpretations-truth-aware.mjs'
      - 'scripts/validate-interpretation-scene.mjs'
      - 'scripts/validate-interpretation-truth-aware.mjs'
      - '.github/workflows/review-interpretations-truth-aware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply truth-aware review
        run: node scripts/review-interpretations-truth-aware.mjs
      - name: Validate every scene
        run: |
          node scripts/validate-interpretation-scene.mjs act1-scene1
          node scripts/validate-interpretation-scene.mjs act1-scene2
          node scripts/validate-interpretation-scene.mjs act2
          node scripts/validate-interpretation-truth-aware.mjs
      - name: Commit reviewed canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/interpretation/act1-scene1.json data/interpretation/act1-scene2.json data/interpretation/act2.json data/interpretation/truth-ledger.json
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Complete truth-aware review of all interpretations'
            git push
          fi
