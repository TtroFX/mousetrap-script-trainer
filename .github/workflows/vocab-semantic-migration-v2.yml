name: Vocabulary Semantic Integration V2

on:
  push:
    branches: ["fix/vocabulary-meaning-in-this-play"]
    paths:
      - 'scripts/zzz_vocab_semantic_migration_v2.mjs'
      - '.github/workflows/vocab-semantic-migration-v2.yml'

permissions:
  contents: write

jobs:
  migrate-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tighten optional In this play selection
        run: perl -0pi -e "s/if\(text&&keepInThisPlay\(text\)\)/if(text&&keepInThisPlay(text)&&text!==String(d.meaning).trim())/" scripts/zzz_vocab_semantic_migration_v2.mjs
      - name: Update static dictionary presentation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tests/index_zero_static.mjs')
          s=p.read_text()
          old="if(dictionaryView.includes('Pattern')||dictionaryView.includes('In this play')||!dictionaryView.includes('vocab?.meaning || entry?.contextMeaning || entry?.coreMeaning'))fail('dictionary presentation contract invalid');if(!data.includes('validateVocabulary')||!data.includes('playMeaning === true')||!data.includes('Pattern fields are forbidden'))fail('Vocabulary/Dictionary contract missing');"
          new="if(dictionaryView.includes('Pattern')||!dictionaryView.includes('In this play')||!dictionaryView.includes('entry?.meaning || vocab?.meaning || entry?.coreMeaning'))fail('dictionary presentation contract invalid');if(!data.includes('validateVocabularyDictionaryConsistency')||!data.includes('inThisPlay')||!data.includes('play-context fields are forbidden')||!data.includes('playMeaning === true'))fail('Vocabulary/Dictionary contract missing');"
          if old not in s: raise SystemExit('old static dictionary contract not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply semantic integration migration
        id: migrate
        continue-on-error: true
        run: node scripts/zzz_vocab_semantic_migration_v2.mjs > migration-debug.log 2>&1
      - name: Persist migration failure details
        if: steps.migrate.outcome == 'failure'
        run: |
          mkdir -p data
          cp migration-debug.log data/vocab-migration-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-migration-debug.log
          git commit -m 'Record vocabulary migration failure [skip ci]'
          git push
          exit 1
      - name: Validate dedicated vocabulary semantics
        id: semantic
        continue-on-error: true
        run: node scripts/validate-vocabulary-semantics.mjs > semantic-debug.log 2>&1
      - name: Persist semantic validation failure details
        if: steps.semantic.outcome == 'failure'
        run: |
          mkdir -p data
          cp semantic-debug.log data/vocab-semantic-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-semantic-debug.log
          git commit -m 'Record vocabulary semantic validation failure [skip ci]'
          git push
          exit 1
      - name: Validate runtime and production assembly
        id: runtime
        continue-on-error: true
        run: |
          {
            node --check app/src/data-store.js
            node --check app/src/study/dictionary-sheet.js
            node --check app/scripts/assemble-production.mjs
            (cd app && node tests/index_zero_static.mjs)
            (cd app && node scripts/assemble-production.mjs --verify-only)
          } > runtime-debug.log 2>&1
      - name: Persist runtime validation failure details
        if: steps.runtime.outcome == 'failure'
        run: |
          mkdir -p data
          cp runtime-debug.log data/vocab-runtime-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-runtime-debug.log
          git commit -m 'Record vocabulary runtime validation failure [skip ci]'
          git push
          exit 1
      - name: Assemble browser QA artifact
        run: |
          rm -rf public
          (cd app && node scripts/assemble-production.mjs --out-dir ../public)
      - name: Install browser QA
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run complete UI regression
        id: e2e
        continue-on-error: true
        working-directory: app
        run: npm run test:e2e > ../e2e-debug.log 2>&1
      - name: Persist browser regression failure details
        if: steps.e2e.outcome == 'failure'
        run: |
          mkdir -p data
          cp e2e-debug.log data/vocab-e2e-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-e2e-debug.log
          git commit -m 'Record vocabulary browser regression failure [skip ci]'
          git push
          exit 1
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mousetrap_word_dictionary.json mousetrap_line_vocabulary.json data/canonical-production-contract.json data/canonical-integration-manifest.json scripts/validate-vocabulary-semantics.mjs app/src/data-store.js app/src/study/dictionary-sheet.js app/src/app.css app/scripts/assemble-production.mjs app/tests/canonical_study.e2e.spec.js app/tests/index_zero_static.mjs .github/workflows/app-qa.yml .github/workflows/pages.yml
          git diff --cached --check
          git commit -m 'Complete Meaning and In this play integration [skip ci]'
          git push
