name: Integrate Vocabulary Scope 1-291

on:
  push:
    branches: ["feature/integrate-vocab-1-291-clean"]
    paths:
      - '.github/workflows/integrate-vocab-scope-1-291.yml'
      - 'scripts/.vocab-scope-1-291-new-*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and patch reviewed enrichment script
        run: |
          cat scripts/.vocab-scope-1-291-new-*.b64 > /tmp/enrich.b64
          base64 -d /tmp/enrich.b64 | gzip -d > /tmp/enrich.mjs
          BASE_SHA="$(sha256sum /tmp/enrich.mjs | cut -d' ' -f1)"
          test "$BASE_SHA" = "27531c4fbf91748c86e7f194309e39b74258131449347ade7c070d10f3fd1c4d"
          python3 - <<'PY'
          p='/tmp/enrich.mjs'
          s=open(p,encoding='utf-8').read()
          replacements=[
            ("const key = v => norm(v).toLowerCase();", "const key = v => norm(v).toLowerCase();\nconst runtimeKey = v => String(v ?? '').trim().toLowerCase();"),
            ("const dictByLower = new Map(Object.entries(dictionary).map(([dk,e]) => [key(dk),e]));", "const beforeRuntimeKeys = new Set();\nlet beforeDuplicateDictionaryKeys=0;\nfor (const dk of Object.keys(beforeDict)) { const k=runtimeKey(dk); if (beforeRuntimeKeys.has(k)) beforeDuplicateDictionaryKeys++; else beforeRuntimeKeys.add(k); }\nconst dictByLower = new Map(Object.entries(dictionary).map(([dk,e]) => [runtimeKey(dk),e]));"),
            ("const k=key(dk); if (dictCaseKeys.has(k)) duplicateDictionaryKeys++; else dictCaseKeys.add(k);", "const k=runtimeKey(dk); if (dictCaseKeys.has(k)) duplicateDictionaryKeys++; else dictCaseKeys.add(k);"),
            ("if (duplicateDictionaryKeys) errors.push(`duplicate dictionary keys case-insensitive=${duplicateDictionaryKeys}`);", "if (duplicateDictionaryKeys > beforeDuplicateDictionaryKeys) errors.push(`new duplicate dictionary keys case-insensitive=${duplicateDictionaryKeys}/${beforeDuplicateDictionaryKeys}`);"),
            ("const dupKey = `${key(surface)}\\0${key(lemma)}`;", "const dupKey = `${runtimeKey(surface)}\\0${runtimeKey(lemma)}`;"),
            ("const d = dictByLower.get(key(lemma));", "const d = dictByLower.get(runtimeKey(lemma));")
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('patch anchor missing: '+old)
              s=s.replace(old,new,1)
          curly='get the bit between one’s teeth'
          ascii="get the bit between one's teeth"
          if curly not in s: raise SystemExit('curly idiom rule not found')
          s=s.replace(curly,ascii)
          open(p,'w',encoding='utf-8').write(s)
          PY
          node --check /tmp/enrich.mjs

      - name: Canonicalize pre-existing duplicate idiom
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const vp='mousetrap_line_vocabulary.json',dp='mousetrap_word_dictionary.json';
          const v=JSON.parse(fs.readFileSync(vp,'utf8')),d=JSON.parse(fs.readFileSync(dp,'utf8'));
          const rows=v['act1-scene2-speech-0034'];
          const asciiLemma="get the bit between one's teeth",curlyLemma='get the bit between one’s teeth';
          const ascii=rows.find(x=>x.surface==='Got the bit between their teeth'&&x.lemma===asciiLemma);
          const curly=rows.find(x=>x.surface==='Got the bit between their teeth'&&x.lemma===curlyLemma);
          if(!ascii||!curly) throw new Error('expected duplicate idiom pair not found');
          if(curly.inThisPlay) ascii.inThisPlay=curly.inThisPlay;
          ascii.playMeaning=true; ascii.meaning=d[asciiLemma].meaning;
          v['act1-scene2-speech-0034']=rows.filter(x=>x!==curly); delete d[curlyLemma];
          fs.writeFileSync(vp,JSON.stringify(v,null,2)+'\n'); fs.writeFileSync(dp,JSON.stringify(d,null,2)+'\n');
          EOF

      - name: Apply scope 1-291 enrichment to latest main baseline
        run: node /tmp/enrich.mjs

      - name: Reconcile manifest and flexible assembler counts
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const vp='mousetrap_line_vocabulary.json',dp='mousetrap_word_dictionary.json',mp='data/canonical-integration-manifest.json';
          const v=read(vp),d=read(dp),m=read(mp);
          const rows=Object.values(v).flat();
          const play=rows.filter(x=>x.playMeaning===true).length;
          const neutral=rows.length-play;
          const inThis=rows.filter(x=>typeof x.inThisPlay==='string'&&x.inThisPlay.trim()).length;
          const annotated=Object.values(v).filter(a=>Array.isArray(a)&&a.length).length;
          const refs=new Set(rows.map(x=>String(x.lemma||'').trim().toLowerCase())).size;
          Object.assign(m.studyAssets.lineVocabulary,{items:rows.length,annotatedSpeeches:annotated,playMeaningItems:play,neutralOnlyItems:neutral,inThisPlayItems:inThis});
          Object.assign(m.studyAssets.wordDictionary,{entries:Object.keys(d).length,referencedLemmas:refs});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
          const ap='app/scripts/assemble-production.mjs';
          let a=fs.readFileSync(ap,'utf8');
          a=a.replace(/if\(vocabularyDisplayed!==\d+\|\|vocabularyNeutralOnly!==\d+\)fail\(`vocabulary presentation counts invalid \(\$\{vocabularyDisplayed\}\/\$\{vocabularyNeutralOnly\}\)`\);/,"if(vocabularyDisplayed+vocabularyNeutralOnly!==vocabItems)fail(`vocabulary presentation counts invalid (${vocabularyDisplayed}/${vocabularyNeutralOnly} vs ${vocabItems})`);");
          fs.writeFileSync(ap,a);
          EOF

      - name: Validate runtime production assembly
        working-directory: app
        run: |
          node --check src/data-store.js
          node --check scripts/assemble-production.mjs
          node scripts/assemble-production.mjs --verify-only

      - name: Mark integrated report PASS
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const p='data/vocabulary-scope-1-291-report.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.status!=='PASS') throw new Error('scope report not PASS');
          r.qa.appCompatibility='PASS';
          r.cleanup={preExistingDuplicateIdiomsCanonicalized:1};
          r.integration={baseMain:'4d457ef1784a5d9f1847e6f8e62eef439232266e',preservedAllOutOfScopeLines:true};
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          EOF

      - name: Final independent assertions
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const r=read('data/vocabulary-scope-1-291-report.json'),v=read('mousetrap_line_vocabulary.json'),d=read('mousetrap_word_dictionary.json'),m=read('data/canonical-integration-manifest.json');
          if(r.status!=='PASS'||r.qa.appCompatibility!=='PASS') throw new Error('report gate');
          if(r.scope.speechCount!==291||r.scope.first!=='act1-scene1-speech-0001'||r.scope.last!=='act1-scene2-speech-0101'||r.scope.nextExcluded!=='act1-scene2-speech-0102') throw new Error('scope boundary');
          if(r.stageDirections.reviewedCueGroups!==238||r.stageDirections.coveredCueGroups!==238||r.stageDirections.coverage!=='PASS') throw new Error('stage coverage');
          if(r.qa.outsideScopeLineMutations!==0||r.qa.duplicateCheck!=='PASS'||r.qa.missingDictionaryReferenceCheck!=='PASS'||r.qa.jsonParse!=='PASS'||r.qa.dictionarySchema!=='PASS'||r.qa.lineVocabularySchema!=='PASS') throw new Error('integrity gate');
          if(r.qa.secondPassRescan!=='PASS'||r.qa.polysemyAudit!=='PASS'||r.qa.properNounAudit!=='PASS'||r.qa.stageDirectionAudit!=='PASS'||r.qa.phraseSegmentationAudit!=='PASS') throw new Error('review gate');
          const rows=Object.values(v).flat(),play=rows.filter(x=>x.playMeaning===true).length,neutral=rows.length-play,inThis=rows.filter(x=>typeof x.inThisPlay==='string'&&x.inThisPlay.trim()).length;
          if(Object.keys(v).length!==1164||rows.length!==r.vocabulary.totalItems||Object.keys(d).length!==r.dictionary.afterEntries) throw new Error('count gate');
          if(m.studyAssets.lineVocabulary.items!==rows.length||m.studyAssets.lineVocabulary.playMeaningItems!==play||m.studyAssets.lineVocabulary.neutralOnlyItems!==neutral||m.studyAssets.lineVocabulary.inThisPlayItems!==inThis||m.studyAssets.wordDictionary.entries!==Object.keys(d).length) throw new Error('manifest gate');
          const bit=v['act1-scene2-speech-0034'].filter(x=>x.surface==='Got the bit between their teeth');
          if(bit.length!==1||bit[0].lemma!=="get the bit between one's teeth"||Object.prototype.hasOwnProperty.call(d,'get the bit between one’s teeth')) throw new Error('idiom canonicalization');
          console.log(JSON.stringify({status:'PASS',scope:r.scope,vocabulary:r.vocabulary,dictionary:r.dictionary,stageDirections:r.stageDirections,qa:r.qa,manifest:{items:rows.length,playMeaningItems:play,neutralOnlyItems:neutral,inThisPlayItems:inThis,dictionaryEntries:Object.keys(d).length}},null,2));
          EOF

      - name: Commit integrated production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/.vocab-scope-1-291-new-*.b64
          git rm -f .github/workflows/integrate-vocab-scope-1-291.yml
          git add -A
          git diff --cached --check
          git commit -m 'Integrate vocabulary for global speeches 1-291 [skip ci]'
          git push origin HEAD:feature/integrate-vocab-1-291-clean

      - name: Final repository cleanliness
        run: git status --short
