name: Vocabulary Final Closure

on:
  push:
    branches:
      - fix/vocabulary-final-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate vocabulary audits
        run: |
          node scripts/audit-vocabulary-dictionary-style.mjs
          node scripts/audit-vocabulary-context-precision.mjs

      - name: Enforce vocabulary closure invariants
        run: |
          node scripts/validate-vocabulary-semantics.mjs
          node - <<'NODE'
          const fs = require('fs');
          const style = JSON.parse(fs.readFileSync('data/vocabulary-dictionary-style-audit.json','utf8'));
          const ctx = JSON.parse(fs.readFileSync('data/vocabulary-context-precision-audit.json','utf8'));
          const bad = [];
          if (style.counts.singleWordNoHeader !== 0) bad.push(`singleWordNoHeader=${style.counts.singleWordNoHeader}`);
          if (style.counts.multiPosCombinedHeader !== 0) bad.push(`multiPosCombinedHeader=${style.counts.multiPosCombinedHeader}`);
          if (style.counts.multiPosWithoutSeparateHeaders !== 0) bad.push(`multiPosWithoutSeparateHeaders=${style.counts.multiPosWithoutSeparateHeaders}`);
          if (ctx.counts.genericProperNounMissingContext !== 0) bad.push(`genericProperNounMissingContext=${ctx.counts.genericProperNounMissingContext}`);
          if (ctx.counts.dictionaryPlayContextCandidates !== 0) bad.push(`dictionaryPlayContextCandidates=${ctx.counts.dictionaryPlayContextCandidates}`);
          if (bad.length) throw new Error(`Vocabulary closure failed: ${bad.join(', ')}`);
          console.log(JSON.stringify({status:'PASS',dictionaryStyle:style.counts,contextPrecision:ctx.counts},null,2));
          NODE

      - name: Verify production assembly
        working-directory: app
        run: |
          node --check src/study/dictionary-sheet.js
          node scripts/assemble-production.mjs --verify-only
          node scripts/assemble-production.mjs --out-dir ../public

      - name: Install targeted browser QA
        working-directory: app
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run vocabulary UI regression
        working-directory: app
        run: npx playwright test tests/canonical_study.e2e.spec.js --config=playwright.index-zero.config.js
