name: Refine Vocabulary Meaning Fields

on:
  push:
    branches:
      - fix/vocabulary-meaning-in-this-play
    paths:
      - 'scripts/refine-vocabulary-meaning-fields.mjs'
      - '.github/workflows/refine-vocabulary-meaning-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check scripts/refine-vocabulary-meaning-fields.mjs

      - name: Refine canonical vocabulary JSON
        run: node scripts/refine-vocabulary-meaning-fields.mjs

      - name: Validate semantic split
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const report=read('data/vocabulary-meaning-refinement-report.json');
          const vocab=read('mousetrap_line_vocabulary.json');
          const dict=read('mousetrap_word_dictionary.json');
          if(report.status!=='PASS') throw new Error('refinement report not PASS');
          if(report.dictionary.unsafeFallbackCount!==0) throw new Error(`unsafe neutral fallback remains: ${report.dictionary.unsafeFallbackCount}`);
          if(report.dictionary.neutralSource+report.dictionary.baselineGloss+report.dictionary.baselineCore!==report.dictionary.entries) throw new Error('dictionary provenance coverage mismatch');
          if(report.dictionary.entries!==1000) throw new Error(`dictionary count changed: ${report.dictionary.entries}`);
          if(report.vocabulary.speeches!==1164||report.vocabulary.items!==1741) throw new Error('vocabulary coverage/count changed');
          if(report.vocabulary.inThisPlayItems<=0) throw new Error('no optional inThisPlay entries restored');
          if(report.vocabulary.matchedCuratedKeys!==report.sources.curatedUniqueKeys) throw new Error(`curated context key mismatch ${report.vocabulary.matchedCuratedKeys}/${report.sources.curatedUniqueKeys}`);
          let items=0, inThisPlay=0, singleWordFormatted=0;
          const dictByLemma=new Map();
          for(const [key,entry] of Object.entries(dict)){
            if(!entry.meaning||!entry.coreMeaning) throw new Error(`dictionary fields missing: ${key}`);
            if(Object.prototype.hasOwnProperty.call(entry,'contextMeaning')) throw new Error(`legacy dictionary.contextMeaning remains: ${key}`);
            const lemma=String(entry.lemma||key).trim();
            if(lemma&&!/\s/.test(lemma)){
              if(!/^【[^】]+】\n/.test(entry.meaning)) throw new Error(`single-word Meaning lacks POS heading: ${key}`);
              singleWordFormatted++;
            }
            dictByLemma.set(String(key).trim().toLowerCase(),entry);
            dictByLemma.set(String(entry.lemma||'').trim().toLowerCase(),entry);
          }
          for(const [speechId,rows] of Object.entries(vocab)){
            if(!Array.isArray(rows)) throw new Error(`invalid vocabulary rows ${speechId}`);
            for(const item of rows){
              items++;
              const d=dictByLemma.get(String(item.lemma||'').trim().toLowerCase());
              if(!d||item.meaning!==d.meaning) throw new Error(`non-dictionary Meaning ${speechId}: ${item.lemma}`);
              if(typeof item.playMeaning!=='boolean') throw new Error(`playMeaning compatibility lost ${speechId}`);
              if(Object.prototype.hasOwnProperty.call(item,'inThisPlay')){
                if(!String(item.inThisPlay||'').trim()) throw new Error(`blank inThisPlay ${speechId}: ${item.lemma}`);
                inThisPlay++;
              }
            }
          }
          if(items!==1741||inThisPlay!==report.vocabulary.inThisPlayItems) throw new Error('post-write count mismatch');
          console.log(JSON.stringify({status:'PASS',dictionary:Object.keys(dict).length,items,inThisPlay,singleWordFormatted,neutralSource:report.dictionary.neutralSource,baselineGloss:report.dictionary.baselineGloss,baselineCore:report.dictionary.baselineCore},null,2));
          EOF

      - name: Validate production assembly
        working-directory: app
        run: |
          node --check src/data-store.js
          node --check scripts/assemble-production.mjs
          node scripts/assemble-production.mjs --verify-only

      - name: Commit refined JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mousetrap_line_vocabulary.json \
                  mousetrap_word_dictionary.json \
                  data/canonical-production-contract.json \
                  data/canonical-integration-manifest.json \
                  data/vocabulary-context-expansion-report.json \
                  data/vocabulary-meaning-refinement-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Refine dictionary-style Meaning and optional In this play [skip ci]'
          git push origin HEAD:fix/vocabulary-meaning-in-this-play

      - name: Final status
        run: git status --short
