name: Recover Act 2 Interpretation

on:
  push:
    branches: ["feature/interpretation-act2"]
    paths:
      - '.github/workflows/recover-interpretation-act2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover staged payload
        run: |
          python - <<'PY'
          import base64, bz2, pathlib
          parts = [pathlib.Path(f'.tmp/act2-interp.part{i}').read_text().strip() for i in (1,2,3)]
          raw = bz2.decompress(base64.b64decode(''.join(parts)))
          out = pathlib.Path('data/interpretation/act2.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          PY
      - name: Validate Act 2 interpretation
        run: node scripts/validate-interpretation-scene.mjs act2
      - name: Commit canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/interpretation/act2.json
          git commit -m 'Add Act 2 interpretation data'
          git push
