<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cue Practice</title><style>body{margin:0;background:#181614;color:#f8f3ec;font-family:system-ui}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#24211e;border:1px solid #4a433d;border-radius:18px;padding:18px;margin:12px 0}.cue{font-size:22px}.answer{font-size:24px;font-weight:800}.btn{border:0;border-radius:999px;padding:10px 14px;margin:4px;font-weight:800}.role{display:block;width:100%;padding:12px;margin:8px 0;background:#2c2824;color:white;border:1px solid #554d45;border-radius:14px}.muted{color:#bcb3aa}</style></head><body><div class="wrap"><button class="btn" id="close">Close</button><h1>Cue Practice</h1><div id="app">Loading…</div></div><script>(()=>{'use strict';const CAST=['MOLLIE','TROTTER','GILES','MISS CASEWELL','CHRISTOPHER','MRS. BOYLE','PARAVICINI','MAJOR METCALF'];let D,scene='act1-scene1',role='',cards=[],i=0,revealed=false;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('mousetrap_script_data.json',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);D=await r.json();startFromPending()}function validScene(s){return !!D?.[s]?.speeches}function derive(s,c){const a=D[s].speeches,out=[];for(let n=1;n<a.length;n++)if(a[n].speaker===c)out.push({id:a[n].id,cue:a[n-1],answer:a[n]});return out}function startFromPending(){let p;try{p=JSON.parse(localStorage.getItem('mts.practice.pending')||'null')}catch{}scene=validScene(p?.sceneId)?p.sceneId:(validScene(localStorage.getItem('mts.selectedSceneId'))?localStorage.getItem('mts.selectedSceneId'):'act1-scene1');const line=p?.lineId||'';if(line){for(const c of CAST){const a=derive(scene,c),k=a.findIndex(x=>x.id===line);if(k>=0){role=c;cards=a;i=k;localStorage.setItem('mts.characterId',c);localStorage.removeItem('mts.practice.pending');return render()}}return fail('指定台詞には練習対象の直前Cueがありません。')}role=CAST.includes(localStorage.getItem('mts.characterId'))?localStorage.getItem('mts.characterId'):'';if(role&&derive(scene,role).length){cards=derive(scene,role);return render()}choose()}function choose(){$('app').innerHTML=`<div class="card"><h2>Role</h2>${CAST.map(c=>`<button class="role" data-role="${esc(c)}">${esc(c)} <span class="muted">${derive(scene,c).length} cues</span></button>`).join('')}</div>`;$('app').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;cards=derive(scene,role);i=0;localStorage.setItem('mts.characterId',role);render()})}function render(){if(!cards.length)return choose();const x=cards[i];$('app').innerHTML=`<div class="card"><div class="muted">${i+1} / ${cards.length}</div><div><b>${esc(x.cue.speaker)}</b></div><div class="cue">${esc(x.cue.text)}</div></div><div class="card"><div class="answer">${revealed?esc(x.answer.text):'?'}</div><div><button class="btn" id="reveal">Reveal</button><button class="btn" data-rate="again">Again</button><button class="btn" data-rate="hard">Hard</button><button class="btn" data-rate="good">Got it</button></div></div>`;$('reveal').onclick=()=>{revealed=true;render()};$('app').querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate(x.id,b.dataset.rate);i=(i+1)%cards.length;revealed=false;render()})}function rate(id,r){let a={};try{a=JSON.parse(localStorage.getItem('mts.practice.cue.ratings')||'{}')}catch{}const o=a[id]||{};a[id]={...o,last:r,attempts:(o.attempts||0)+1,[r]:(o[r]||0)+1,sceneId:scene,character:role,updatedAt:new Date().toISOString()};localStorage.setItem('mts.practice.cue.ratings',JSON.stringify(a));const total=cards.length,done=Object.keys(a).filter(k=>a[k].sceneId===scene).length;let p={};try{p=JSON.parse(localStorage.getItem('mts.sceneProgress')||'{}')}catch{}p[scene]=Math.min(100,Math.round(done/Math.max(1,total)*100));localStorage.setItem('mts.sceneProgress',JSON.stringify(p));parent.postMessage({type:'mts:scene-progress-changed',sceneId:scene,value:p[scene]},'*')}function fail(m){$('app').innerHTML=`<div class="card">FAIL-CLOSED<br>${esc(m)}</div>`}window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='mts:start-cue'&&D){localStorage.setItem('mts.practice.pending',JSON.stringify({mode:'cue',sceneId:m.sceneId,lineId:m.lineId||''}));startFromPending()}});$('close').onclick=()=>parent.location.hash='#/practice';load().catch(e=>fail(e.message))})();</script></body></html>
