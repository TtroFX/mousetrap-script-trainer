<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cue Practice</title>
<style>
:root{--bg:#1e2a3a;--panel:#26364a;--panel2:#f7f5f0;--ink:#f8f7f3;--muted:#aeb9c6;--gold:#d4a017;--danger:#c96d63}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{min-height:100dvh}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);z-index:5}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.icon{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:white;font-size:20px}.icon:active{background:#ffffff12}
.head{text-align:center;min-width:0}.head b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head small{color:var(--muted)}
.track{height:3px;background:#ffffff20;border-radius:9px;overflow:hidden;margin:8px 6px 0}.track i{display:block;height:100%;background:var(--gold);width:0}
.main{padding:14px 18px 20px;min-width:0}.practice{max-width:720px;margin:auto}.card{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:20px;padding:20px;margin-bottom:12px;overflow-wrap:anywhere}
.kicker{font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:900}.cue{font:500 clamp(18px,4.8vw,26px)/1.55 Georgia,"Noto Serif JP",serif;margin-top:9px}
.target{min-height:128px;border:1px dashed #ffffff55;border-radius:17px;padding:20px;display:grid;place-items:center;text-align:left;font:600 clamp(18px,4.5vw,25px)/1.55 Georgia,"Noto Serif JP",serif}
.target.revealed{border-style:solid;border-color:#d4a01788;background:#d4a01712}.question{font-size:44px;color:#8492a4}.hint{width:100%;color:#f7f2e7}.answer{width:100%}
.controls{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff18;background:#182434}.row{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:48px;border:0;border-radius:14px;font-weight:850;font-size:14px;background:#f3f0e9;color:#1e2a3a}.btn.gold{background:var(--gold);color:#171717}.btn:disabled{opacity:.4}.ratings{display:none;grid-template-columns:repeat(3,1fr);gap:8px}.ratings.show{display:grid}.ratings .btn{font-size:12px;padding:8px}.ratings small{display:block;font-weight:600;opacity:.7;margin-top:3px}
.sheet,.gate{position:fixed;inset:0;z-index:20;background:#0008;display:grid;align-items:end}.sheet[hidden],.gate[hidden]{display:none}.sheetin{background:var(--panel2);color:#1e2a3a;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheetin h2{margin:0 0 6px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field select{width:100%;padding:12px;border:1px solid #d5d0c5;border-radius:12px;background:white}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.role{padding:11px;border:1px solid #d8d2c8;border-radius:12px;background:white;text-align:left;font-weight:800;overflow-wrap:anywhere}.role[aria-pressed=true]{border-color:#b6870e;background:#fff7dc}.role:disabled{opacity:.35}.role small{display:block;font-weight:600;color:#6b7280}
.status{white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;background:#fff;border:1px solid #ddd7cc;border-radius:12px;padding:12px;color:#5f6670}.error{color:#a13737}.empty{max-width:720px;margin:auto;text-align:center}
@media(min-width:700px){.sheet,.gate{align-items:center;justify-items:center}.sheetin{width:min(620px,92vw);border-radius:22px}.roles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:380px){.main{padding-left:12px;padding-right:12px}.card{padding:16px}.target{padding:16px}.btn{font-size:13px}}
</style></head>
<body>
<div class="app">
<header class="header"><div class="top"><button class="icon" id="closeBtn" aria-label="Close">✕</button><div class="head"><b id="sceneTitle">Cue Practice</b><small id="counter">—</small></div><button class="icon" id="settingsBtn" aria-label="Settings">⚙</button></div><div class="track"><i id="progressBar"></i></div></header>
<main class="main"><section class="practice" id="practiceView" hidden><div class="card"><div class="kicker" id="cueSpeaker">CUE</div><div class="cue" id="cueText"></div></div><div class="card"><div class="kicker">YOUR LINE · <span id="yourCharacter"></span></div><div class="target" id="answerBox"><div id="answerContent" class="question">?</div></div></div></section><section class="empty" id="emptyView" hidden><div class="card"><h2>このCueは開始できません</h2><p id="emptyText"></p><button class="btn" id="backPractice">Practiceへ戻る</button></div></section></main>
<footer class="controls"><div class="row" id="primaryControls"><button class="btn" id="hintBtn">Hint 1</button><button class="btn gold" id="revealBtn">Reveal</button></div><div class="ratings" id="ratingControls"><button class="btn" data-rating="again">Again<small>思い出せなかった</small></button><button class="btn" data-rating="hard">Hard<small>かなり迷った</small></button><button class="btn gold" data-rating="good">Got it<small>思い出せた</small></button></div></footer>
</div>
<div class="sheet" id="setup" hidden><div class="sheetin"><h2>Cue Practice</h2><p>Sceneと自分の役を選択します。</p><div class="field"><label>Scene</label><select id="sceneSelect"></select></div><div class="field"><label>Your character</label><div class="roles" id="roleGrid"></div></div><button class="btn gold" style="width:100%" id="startBtn" disabled>Start Cue Practice</button></div></div>
<div class="gate" id="dataGate"><div class="sheetin"><h2>Cue Practice</h2><p>canonical Script Dataを検証後に起動します。不完全なデータには切り替えません。</p><div class="status" id="dataStatus">Loading…</div><button class="btn" style="width:100%;margin-top:10px" id="retryData">Retry</button></div></div>
<script src="p6_private_data.js"></script><script>
(()=>{'use strict';
const SECTIONS=[['act1-scene1','Act I · Scene I',190],['act1-scene2','Act I · Scene II',336],['act2','Act II',638]];
const CAST=['MOLLIE','TROTTER','GILES','MISS CASEWELL','CHRISTOPHER','MRS. BOYLE','PARAVICINI','MAJOR METCALF'];
const KEY={selected:'mts.selectedSceneId',character:'mts.characterId',pending:'mts.practice.pending',last:'mts.practice.lastSession',state:'mts.practice.cue.state',ratings:'mts.practice.cue.ratings',sceneProgress:'mts.sceneProgress'};
const $=id=>document.getElementById(id), parse=(x,f)=>{try{return x?JSON.parse(x):f}catch{return f}};
const e={setup:$('setup'),scene:$('sceneSelect'),roles:$('roleGrid'),start:$('startBtn'),practice:$('practiceView'),empty:$('emptyView'),emptyText:$('emptyText'),title:$('sceneTitle'),counter:$('counter'),bar:$('progressBar'),cueSpeaker:$('cueSpeaker'),cueText:$('cueText'),your:$('yourCharacter'),box:$('answerBox'),answer:$('answerContent'),hint:$('hintBtn'),reveal:$('revealBtn'),primary:$('primaryControls'),rating:$('ratingControls'),gate:$('dataGate'),status:$('dataStatus')};
let SCRIPT=null,CUES=null,sceneId='',character='',cards=[],index=0,hintLevel=0,revealed=false,booted=false;
const sec=id=>SECTIONS.find(x=>x[0]===id), stateKey=(id=sceneId,c=character)=>`${id}|${c}`;
const allState=()=>parse(localStorage.getItem(KEY.state),{})||{}, allRatings=()=>parse(localStorage.getItem(KEY.ratings),{})||{};
function validate(d){if(!d||typeof d!=='object'||Array.isArray(d))throw Error('script: object required');let total=0;for(const [id,,count] of SECTIONS){const a=d[id]?.speeches;if(!Array.isArray(a)||a.length!==count)throw Error(`script.${id}: ${a?.length||0}/${count}`);a.forEach((s,i)=>{const expected=`${id}-speech-${String(i+1).padStart(4,'0')}`;if(s?.id!==expected||!String(s.speaker||'').trim()||!String(s.text||'').trim())throw Error(`script order/id invalid ${id} #${i+1}`)});total+=a.length}if(total!==1164)throw Error('script total mismatch');return true}
function derive(d){const out={};for(const [id] of SECTIONS){const speeches=d[id].speeches,cues=[];for(let i=1;i<speeches.length;i++){const target=speeches[i],cue=speeches[i-1];cues.push({id:target.id,sceneId:id,character:target.speaker,text:target.text,cue:{id:cue.id,speaker:cue.speaker,text:cue.text},index:i})}out[id]={speeches,cues}}return out}
function cardsFor(id,c){return (CUES?.[id]?.cues||[]).filter(x=>x.character===c)}
function saveState(){if(!sceneId||!character||!cards.length)return;const a=allState(),current=cards[index];a[stateKey()]={sceneId,character,index,speechId:current?.id||'',hintLevel,revealed,updatedAt:new Date().toISOString()};localStorage.setItem(KEY.state,JSON.stringify(a));localStorage.setItem(KEY.last,JSON.stringify({mode:'cue',sceneId,current:index+1,total:cards.length,character,lineId:current?.id||'',updatedAt:new Date().toISOString()}))}
function restore(){const s=allState()[stateKey()]||{};let n=Number(s.index);n=Number.isFinite(n)&&n>=0&&n<cards.length?Math.floor(n):0;if(s.speechId&&cards[n]?.id!==s.speechId){const k=cards.findIndex(x=>x.id===s.speechId);n=k>=0?k:0}return{index:n,hintLevel:Math.min(3,Math.max(0,Number(s.hintLevel)||0)),revealed:!!s.revealed}}
function updateProgress(){const r=allRatings(),attempted=cards.filter(c=>r[c.id]).length,pct=cards.length?Math.round(attempted/cards.length*100):0,map=parse(localStorage.getItem(KEY.sceneProgress),{})||{};map[sceneId]=Math.max(Number(map[sceneId])||0,pct);localStorage.setItem(KEY.sceneProgress,JSON.stringify(map));parent.postMessage({type:'mts:scene-progress-changed',sceneId,value:map[sceneId],character,source:'008'},'*')}
function rate(r){if(!cards[index]||!['again','hard','good'].includes(r))return false;const a=allRatings(),id=cards[index].id,o=a[id]||{};a[id]={...o,rating:r,last:r,attempts:(o.attempts||0)+1,again:(o.again||0)+(r==='again'?1:0),hard:(o.hard||0)+(r==='hard'?1:0),good:(o.good||0)+(r==='good'?1:0),sceneId,character,updatedAt:new Date().toISOString()};localStorage.setItem(KEY.ratings,JSON.stringify(a));updateProgress();return true}
function hintText(text,level){const w=String(text||'').trim().split(/\s+/).filter(Boolean);if(level===1)return `Starts with: “${w[0]||''}…” · ${w.length} words`;if(level===2)return w.map((x,i)=>i%3===0?x:x.replace(/[A-Za-z0-9]/g,'•')).join(' ');return w.map((x,i)=>i%2===0?x:x.replace(/[A-Za-z0-9]/g,'•')).join(' ')}
function interaction(){e.box.classList.toggle('revealed',revealed);if(revealed){e.answer.className='answer';e.answer.textContent=cards[index].text;e.primary.style.display='none';e.rating.classList.add('show')}else{e.primary.style.display='grid';e.rating.classList.remove('show');e.reveal.disabled=false;e.hint.disabled=hintLevel>=3;e.hint.textContent=hintLevel<3?`Hint ${hintLevel+1}`:'Hint 3';if(hintLevel){e.answer.className='hint';e.answer.textContent=hintText(cards[index].text,hintLevel)}else{e.answer.className='question';e.answer.textContent='?'}}}
function render(preserve=true){if(!cards.length)return failTarget('Cue Practice対象がありません。','');e.empty.hidden=true;e.practice.hidden=false;const c=cards[index];e.title.textContent=SECTIONS.find(x=>x[0]===sceneId)?.[1]||'Cue Practice';e.counter.textContent=`${index+1} / ${cards.length}`;e.bar.style.width=`${(index+1)/cards.length*100}%`;e.cueSpeaker.textContent=c.cue.speaker;e.cueText.textContent=c.cue.text;e.your.textContent=character;if(!preserve){hintLevel=0;revealed=false}interaction();saveState()}
function hint(){if(!cards.length||revealed)return false;hintLevel=Math.min(3,hintLevel+1);interaction();saveState();return true}
function reveal(){if(!cards.length)return false;revealed=true;interaction();saveState();return true}
function next(){if(index<cards.length-1)index++;else index=0;hintLevel=0;revealed=false;render(true)}
function roleUI(){const id=e.scene.value;e.roles.innerHTML=CAST.map(c=>{const n=cardsFor(id,c).length;return `<button class="role" data-role="${c}" ${n?'':'disabled'} aria-pressed="${c===character}">${c}<small>${n} cues</small></button>`}).join('');e.start.disabled=!(character&&cardsFor(id,character).length)}
function openSetup(){e.scene.innerHTML=SECTIONS.map(([id,l])=>`<option value="${id}">${l}</option>`).join('');const s=sec(localStorage.getItem(KEY.selected))?localStorage.getItem(KEY.selected):SECTIONS[0][0];e.scene.value=s;const c=localStorage.getItem(KEY.character)||'';character=CAST.includes(c)&&cardsFor(s,c).length?c:'';roleUI();e.setup.hidden=false}
function failTarget(msg,line){cards=[];e.setup.hidden=true;e.practice.hidden=true;e.empty.hidden=false;e.emptyText.textContent=msg;if(line)document.documentElement.dataset.targetError=line;return false}
function start(id,c,lineId='',fromPending=false){if(!sec(id)||!CAST.includes(c))return false;const a=cardsFor(id,c);if(!a.length)return false;sceneId=id;character=c;cards=a;localStorage.setItem(KEY.selected,id);localStorage.setItem(KEY.character,c);if(lineId){const k=cards.findIndex(x=>x.id===lineId);if(k<0)return failTarget('指定台詞にはこの役の直前Cueがありません。別の台詞へは移動していません。',lineId);index=k;hintLevel=0;revealed=false}else{const s=restore();index=s.index;hintLevel=s.hintLevel;revealed=s.revealed}if(fromPending)localStorage.removeItem(KEY.pending);e.setup.hidden=true;render(true);return true}
function pendingStart(p){if(!p||p.mode!=='cue'||!sec(p.sceneId))return false;if(p.lineId){const scene=CUES[p.sceneId],hit=scene?.cues.find(x=>x.id===p.lineId);if(!hit){localStorage.removeItem(KEY.pending);return failTarget('Scene先頭など直前Cueがないため開始できません。',p.lineId)}if(!CAST.includes(hit.character)){localStorage.removeItem(KEY.pending);return failTarget('このspeakerは練習対象外です。',p.lineId)}return start(p.sceneId,hit.character,p.lineId,true)}const c=localStorage.getItem(KEY.character)||'';if(CAST.includes(c)&&cardsFor(p.sceneId,c).length){localStorage.removeItem(KEY.pending);return start(p.sceneId,c)}return false}
function bootstrap(){if(booted)return;booted=true;const p=parse(localStorage.getItem(KEY.pending),null);if(pendingStart(p))return;const id=localStorage.getItem(KEY.selected)||'',c=localStorage.getItem(KEY.character)||'';if(sec(id)&&CAST.includes(c)&&cardsFor(id,c).length)start(id,c);else openSetup()}
function publish(d){validate(d);SCRIPT=d;CUES=derive(d);window.MTS_SHARED_SCRIPT_DATA=d;e.status.textContent='PASS\n1,164 speeches\n189 / 335 / 637 cues';e.gate.hidden=true;bootstrap();return true}
async function load(){e.gate.hidden=false;e.status.classList.remove('error');e.status.textContent='Loading canonical Script Data…';try{const resolver=window.MTS_PRIVATE_DATA?.getVerifiedResponse;if(typeof resolver!=='function')throw Error('VERIFIED_DATA_RESOLVER_UNAVAILABLE');const r=await resolver('mousetrap_script_data.json');return publish(await r.json())}catch(err){e.status.classList.add('error');e.status.textContent=`FAIL-CLOSED · PRODUCTION DATA UNAVAILABLE\n${err.message}`;throw err}}
e.scene.onchange=()=>{character='';roleUI()};e.roles.onclick=ev=>{const b=ev.target.closest('[data-role]');if(!b||b.disabled)return;character=b.dataset.role;roleUI()};e.start.onclick=()=>start(e.scene.value,character);e.hint.onclick=hint;e.reveal.onclick=reveal;e.rating.onclick=ev=>{const b=ev.target.closest('[data-rating]');if(b&&rate(b.dataset.rating))next()};$('settingsBtn').onclick=()=>{saveState();openSetup()};$('closeBtn').onclick=$('backPractice').onclick=()=>{saveState();parent.postMessage({type:'mts:navigate',target:'practice',screen:'007'},'*')};$('retryData').onclick=()=>load().catch(()=>{});
window.addEventListener('message',ev=>{const m=ev.data||{};if(m.type==='mts:start-cue'&&SCRIPT){const p={mode:'cue',sceneId:m.sceneId,lineId:m.lineId||''};localStorage.setItem(KEY.pending,JSON.stringify(p));pendingStart(p)}});
window.MTS008=Object.freeze({version:4,loadData:d=>publish(d),start:({sceneId,character,lineId}={})=>start(sceneId,character,lineId),openSetup,getState:()=>({sceneId,character,index,total:cards.length,hintLevel,revealed,current:cards[index]?.id||null}),hint,reveal,rate:r=>{if(!rate(r))return false;next();return true},getRatings:allRatings});
load().catch(()=>{});
})();
</script></body></html>
