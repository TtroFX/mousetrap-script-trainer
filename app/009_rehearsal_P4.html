<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rehearsal</title><style>body{margin:0;background:#181614;color:#f8f3ec;font-family:system-ui}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#24211e;border:1px solid #4a433d;border-radius:18px;padding:18px;margin:12px 0}.line{font-size:24px;line-height:1.45}.btn{border:0;border-radius:999px;padding:10px 14px;margin:4px;font-weight:800}.role{display:block;width:100%;padding:12px;margin:8px 0;background:#2c2824;color:white;border:1px solid #554d45;border-radius:14px}.muted{color:#bcb3aa}</style></head><body><div class="wrap"><button class="btn" id="close">Close</button><h1>Rehearsal</h1><div id="app">Loading…</div></div><script>(()=>{'use strict';const CAST=['MOLLIE','TROTTER','GILES','MISS CASEWELL','CHRISTOPHER','MRS. BOYLE','PARAVICINI','MAJOR METCALF'];let D,scene='act1-scene1',role='',items=[],i=0,revealed=false,recognizer=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('mousetrap_script_data.json',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);D=await r.json();startFromPending()}function startFromPending(){let p;try{p=JSON.parse(localStorage.getItem('mts.practice.pending')||'null')}catch{}scene=D[p?.sceneId]?p.sceneId:(D[localStorage.getItem('mts.selectedSceneId')]?localStorage.getItem('mts.selectedSceneId'):'act1-scene1');role=CAST.includes(localStorage.getItem('mts.characterId'))?localStorage.getItem('mts.characterId'):'';if(!role)return choose();items=D[scene].speeches;i=0;render()}function choose(){$('app').innerHTML=`<div class="card"><h2>Role</h2>${CAST.map(c=>`<button class="role" data-role="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;$('app').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;localStorage.setItem('mts.characterId',role);items=D[scene].speeches;i=0;render()})}function speak(text){if(!('speechSynthesis'in window))return false;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));return true}catch{return false}}function rec(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C)return null;try{const r=new C();r.lang='en-GB';r.continuous=false;return r}catch{return null}}function render(){const x=items[i];if(!x)return finish();const mine=x.speaker===role;$('app').innerHTML=`<div class="card"><div class="muted">${i+1} / ${items.length} · ${esc(x.speaker)}</div><div class="line">${mine&&!revealed?'••••••':esc(x.text)}</div><div><button class="btn" id="listen">${mine?'Speak / Reveal':'Listen'}</button><button class="btn" id="next">Next</button></div></div>`;$('listen').onclick=()=>{if(!mine){speak(x.text);return}if(!recognizer)recognizer=rec();if(recognizer){try{recognizer.start()}catch{revealed=true;render()}}else{revealed=true;render()}};$('next').onclick=()=>{if(mine&&!revealed){revealed=true;render();return}i++;revealed=false;save();render()}}function save(){localStorage.setItem('mts.practice.rehearsal.state',JSON.stringify({sceneId:scene,character:role,index:i,updatedAt:new Date().toISOString()}));let p={};try{p=JSON.parse(localStorage.getItem('mts.sceneProgress')||'{}')}catch{}p[scene]=Math.max(Number(p[scene]||0),Math.min(100,Math.round(i/Math.max(1,items.length)*100)));localStorage.setItem('mts.sceneProgress',JSON.stringify(p));parent.postMessage({type:'mts:scene-progress-changed',sceneId:scene,value:p[scene]},'*')}function finish(){let p={};try{p=JSON.parse(localStorage.getItem('mts.sceneProgress')||'{}')}catch{}p[scene]=100;localStorage.setItem('mts.sceneProgress',JSON.stringify(p));$('app').innerHTML='<div class="card"><h2>Scene complete</h2><button class="btn" id="progress">Progress</button></div>';$('progress').onclick=()=>parent.location.hash='#/progress';parent.postMessage({type:'mts:scene-progress-changed',sceneId:scene,value:100},'*')}window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='mts:start-rehearsal'&&D){localStorage.setItem('mts.practice.pending',JSON.stringify({mode:'rehearsal',sceneId:m.sceneId}));startFromPending()}});$('close').onclick=()=>{save();parent.location.hash='#/practice'};load().catch(e=>$('app').textContent='FAIL-CLOSED: '+e.message)})();</script></body></html>
