<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ec">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Script to Stage — The Mousetrap Trainer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/app.css">
  <link rel="stylesheet" href="./src/pdf-pages.css">
  <link rel="stylesheet" href="./src/focus-mode.css">
  <link rel="stylesheet" href="./src/stage-directions.css">
</head>
<body>
  <div id="app">
    <main class="shell">
      <header class="app-top"><div><div class="eyebrow">Script to Stage</div><div class="brand">The Mousetrap Trainer</div></div><button class="ghost-btn" type="button" disabled>Role</button></header>
      <section class="card hero"><div class="eyebrow">Continue</div><h1>Learn Your Lines</h1><p class="muted">Starting the app…</p></section>
    </main>
  </div>
  <div id="word-overlay" class="sheet-backdrop" hidden>
    <section class="word-sheet" role="dialog" aria-modal="true" aria-label="Word dictionary">
      <div class="sheet-handle"><span></span><button id="word-close" type="button" aria-label="Close dictionary">×</button></div>
      <div id="word-content" class="word-content"></div>
    </section>
  </div>
  <div id="status-host" class="status-host" role="status" aria-live="polite" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.MTS_PWA_READY = navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(() => navigator.serviceWorker.ready)
        .catch(error => {
          console.error('Service worker registration failed', error);
          throw error;
        });
    } else {
      window.MTS_PWA_READY = Promise.resolve(null);
    }
  </script>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/stage-directions.js"></script>
</body>
</html>
