<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Line Detail</title><style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#26231f;--muted:#736d65;--line:#ded8cf;--accent:#8b5e3c;--soft:#eee6dc;--s:#607d9b;--v:#b07b35;--o:#64866a;--c:#8b6f88;--m:#737c84}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.wrap{max-width:780px;margin:auto;padding:18px 14px calc(94px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 8px 24px rgba(45,36,29,.055)}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:900}.speaker{font-weight:900;color:var(--accent);margin-bottom:8px}.line-en{font:700 clamp(19px,4.8vw,28px)/1.58 Georgia,"Times New Roman",serif;margin:0;overflow-wrap:anywhere}.translation{font-size:16px;line-height:1.75;margin:.45em 0 0}.muted{color:var(--muted)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{font-size:10px;background:var(--soft);border-radius:999px;padding:5px 8px;color:#5f574f}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h3{margin:0;font-size:16px}.section-title small{color:var(--muted)}.sentence{padding:14px 0;border-top:1px solid #eee8df}.sentence:first-of-type{border-top:0;padding-top:2px}.sentence-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}.sentence-head b{font-size:11px;letter-spacing:.08em;color:var(--muted)}.sentence-text{font:650 17px/1.65 Georgia,"Times New Roman",serif;margin:0 0 12px}.structure-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 5px}.struct-chunk{--role:var(--m);display:inline-grid;grid-template-rows:auto auto auto;min-width:44px;max-width:100%;padding:3px 5px 4px;border:0;background:transparent;color:inherit;text-align:left;border-radius:8px;cursor:pointer}.struct-chunk:hover,.struct-chunk:focus-visible{background:#f4f0ea;outline:none}.struct-chunk[data-base="S"]{--role:var(--s)}.struct-chunk[data-base="V"]{--role:var(--v)}.struct-chunk[data-base="O"]{--role:var(--o)}.struct-chunk[data-base="C"]{--role:var(--c)}.struct-chunk[data-base="M"]{--role:var(--m)}.chunk-role{font-size:10px;line-height:1.1;color:var(--role);font-weight:950;letter-spacing:.04em}.chunk-text{font:700 15px/1.48 Georgia,"Times New Roman",serif;border-bottom:2px solid color-mix(in srgb,var(--role) 76%,transparent);padding:3px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}.chunk-type{font-size:9px;line-height:1.2;color:#827a72;font-weight:800;padding-top:3px}.chunk-info{display:none;margin-top:11px;padding:11px 12px;border-radius:13px;background:#f5f1eb;border:1px solid #e6ded4;font-size:13px;line-height:1.6}.chunk-info.show{display:block}.chunk-info b{color:var(--accent)}.structure-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.legend{font-size:10px;font-weight:800;color:var(--muted)}.legend i{display:inline-block;width:13px;height:2px;vertical-align:middle;margin-right:4px;background:currentColor}.legend.s{color:var(--s)}.legend.v{color:var(--v)}.legend.o{color:var(--o)}.legend.c{color:var(--c)}.legend.m{color:var(--m)}details.deep{margin-top:12px;border-top:1px solid #eee8df;padding-top:10px}details.deep>summary{cursor:pointer;list-style:none;font-weight:900;color:var(--accent);padding:7px 0}details.deep>summary::-webkit-details-marker{display:none}details.deep>summary::after{content:'＋';float:right;color:var(--muted)}details.deep[open]>summary::after{content:'−'}.grammar{line-height:1.65;border-top:1px solid #eee8df;padding:11px 0}.grammar:first-child{border-top:0}.grammar b{display:block;margin-bottom:3px}.word{display:block;width:100%;text-align:left;border:1px solid #e4ddd3;background:#faf7f2;border-radius:13px;padding:11px 12px;margin:7px 0;cursor:pointer;color:var(--ink)}.word:hover{border-color:#bfa58f}.word b{display:block}.word small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:14px}.warning{color:#8c5a2b;background:#fff6e8;border:1px solid #ead0a8;border-radius:12px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:0;background:var(--accent);color:white;border-radius:999px;padding:10px 14px;font-weight:850;min-height:42px;cursor:pointer}.action.secondary{background:var(--soft);color:var(--ink)}.float-nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;display:flex;justify-content:space-between;padding:0 14px}.navbtn{pointer-events:auto;width:52px;height:52px;border:1px solid rgba(222,216,207,.9);border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(45,36,29,.12);font-size:22px;color:var(--ink);cursor:pointer}.navbtn:disabled{opacity:.24}.fail{margin-top:40px}@media(max-width:520px){.wrap{padding-inline:11px}.card{padding:14px;border-radius:18px}.structure-row{gap:7px 2px}.struct-chunk{padding-inline:4px}.chunk-text{font-size:14px}.float-nav{padding-inline:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="wrap"><main id="main">Loading…</main></div><div class="float-nav" id="floatNav" hidden><button class="navbtn" id="prevLine" aria-label="前の台詞">‹</button><button class="navbtn" id="nextLine" aria-label="次の台詞">›</button></div><script src="p6_private_data.js"></script><script>
(()=>{'use strict';
let script={},trans={},vocab={},grammar={},dict={},structure=null,current=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLE={S:['主語','Subject'],V:['述語・動詞','Verb'],O:['目的語','Object'],C:['補語','Complement'],M:['修飾語','Modifier'],"S'":['従属構造の主語','Embedded subject'],"V'":['従属構造の述語','Embedded verb'],"O'":['従属構造の目的語','Embedded object'],"C'":['従属構造の補語','Embedded complement']};
const TYPE={NP:['名詞句','Noun Phrase'],VP:['動詞句','Verb Phrase'],PP:['前置詞句','Prepositional Phrase'],AdvP:['副詞句','Adverb Phrase'],AdjP:['形容詞句','Adjective Phrase'],NC:['名詞節','Noun Clause'],AC:['形容詞節','Adjective Clause'],AdvC:['副詞節','Adverbial Clause'],Inf:['不定詞','Infinitive'],Gerund:['動名詞','Gerund'],Participle:['分詞','Participle'],PhrasalVerb:['句動詞','Phrasal Verb'],FixedExpression:['定型表現','Fixed Expression']};
async function canonical(p){const resolver=window.MTS_PRIVATE_DATA?.getVerifiedResponse;if(typeof resolver!=='function')throw Error(`VERIFIED_DATA_RESOLVER_UNAVAILABLE:${p}`);const r=await resolver(p);if(!r?.ok)throw Error(`VERIFIED_DATA_UNAVAILABLE:${p}`);return r.json()}
async function structureData(){const r=await fetch('mousetrap_line_structure.json',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error(`STRUCTURE_HTTP_${r.status}`);const d=await r.json();if(d?.schemaVersion!==1||d?.counts?.speeches!==1164||d?.counts?.sentences!==2277||d?.counts?.chunks!==8055)throw Error('STRUCTURE_CONTRACT_INVALID');return d}
function find(s,id){return script?.[s]?.speeches?.find(x=>x.id===id)||null}function sibling(s,id,d){const a=script?.[s]?.speeches||[],i=a.findIndex(x=>x.id===id),n=i+d;return n>=0&&n<a.length?a[n]:null}function sceneLabel(s){return s==='act1-scene1'?'Act I · Scene I':s==='act1-scene2'?'Act I · Scene II':s==='act2'?'Act II':s}function dictEntry(lemma){if(!lemma)return null;return dict[lemma]||dict[Object.keys(dict).find(k=>k.toLowerCase()===String(lemma).toLowerCase())]||null}
function roleBase(r){return String(r||'M').charAt(0)}
function structureHtml(x,id){const line=structure?.lines?.[id];if(!line?.sentences?.length)return '<p class="warning">この台詞のcanonical Structureを読み込めません。</p>';return line.sentences.map((s,si)=>{const sentence=x.text.slice(s.start,s.end);const chunks=s.chunks.map((c,ci)=>{const txt=sentence.slice(c.start,c.end),rb=roleBase(c.role);return `<button class="struct-chunk" data-sentence="${si}" data-chunk="${ci}" data-base="${esc(rb)}" aria-label="${esc(c.role)} ${esc(c.type)}"><span class="chunk-role">${esc(c.role)}</span><span class="chunk-text">${esc(txt)}</span><span class="chunk-type">${esc(c.type)}</span></button>`}).join('');return `<section class="sentence"><div class="sentence-head"><b>Sentence ${si+1}</b>${s.highRisk?'<span class="chip">reviewed</span>':''}</div><p class="sentence-text">${esc(sentence)}</p><div class="structure-row">${chunks}</div><div class="chunk-info" data-chunk-info="${si}"></div></section>`}).join('')}
function bindChunks(x,id){const line=structure?.lines?.[id];$('main').querySelectorAll('.struct-chunk').forEach(btn=>btn.onclick=()=>{const si=Number(btn.dataset.sentence),ci=Number(btn.dataset.chunk),s=line?.sentences?.[si],c=s?.chunks?.[ci];if(!s||!c)return;const sentence=x.text.slice(s.start,s.end),txt=sentence.slice(c.start,c.end),r=ROLE[c.role]||[c.role,c.role],t=TYPE[c.type]||[c.type,c.type],box=$('main').querySelector(`[data-chunk-info="${si}"]`);if(!box)return;box.innerHTML=`<b>${esc(c.role)} · ${esc(r[0])}</b> — ${esc(t[0])} <span class="muted">(${esc(t[1])})</span><br><span>${esc(txt)}</span>`;box.classList.add('show')})}
function openWord(v){if(!current||!v)return;parent.postMessage({type:'mts:open-word',sceneId:current.s,lineId:current.id,lemma:v.lemma,surface:v.surface},'*')}
function showLine(s,id){const x=find(s,id);if(!x){$('main').innerHTML='<section class="card fail"><p class="warning">このspeechは見つかりません。</p></section>';return}current={s,id,x};localStorage.setItem('mts.lineDetail.current',JSON.stringify({sceneId:s,lineId:id}));const t=trans[id],vv=Array.isArray(vocab[id])?vocab[id]:[],gg=Array.isArray(grammar[id])?grammar[id]:[],prev=sibling(s,id,-1),next=sibling(s,id,1);$('floatNav').hidden=false;$('prevLine').disabled=!prev;$('nextLine').disabled=!next;$('main').innerHTML=`<section class="card"><div class="speaker">${esc(x.speaker)}</div><p class="line-en">${esc(x.text)}</p><div class="meta"><span class="chip">${esc(sceneLabel(s))}</span></div></section><section class="card"><div class="eyebrow">Translation</div>${t?.translation?`<p class="translation">${esc(t.translation)}</p>`:'<p class="warning">日本語訳は利用できません。</p>'}</section><section class="card"><div class="section-title"><h3>Structure</h3><small>S / V / O / C / M</small></div>${structureHtml(x,id)}<div class="structure-legend"><span class="legend s"><i></i>S 主語</span><span class="legend v"><i></i>V 動詞</span><span class="legend o"><i></i>O 目的語</span><span class="legend c"><i></i>C 補語</span><span class="legend m"><i></i>M 修飾</span></div><details class="deep"><summary>詳しく見る</summary><div class="section-title"><h3>Grammar / Usage</h3></div>${gg.length?gg.map(g=>`<div class="grammar"><b>${esc(g.pattern)}</b>${esc(g.description)}</div>`).join(''):'<p class="empty">追加Grammar noteはありません。</p>'}<div class="section-title" style="margin-top:18px"><h3>Words</h3></div>${vv.length?vv.map((v,i)=>{const d=dictEntry(v.lemma);return `<button class="word" data-vocab="${i}"><b>${esc(v.surface)} · ${esc(v.meaning)}</b><small>${esc(v.lemma)}${d?.pos?` · ${esc(d.pos)}`:''}</small></button>`}).join(''):'<p class="empty">登録Vocabularyはありません。</p>'}</details></section><section class="card"><div class="actions"><button class="action" id="cue">Cue Practice</button><button class="action secondary" id="rehearsal">Rehearsal</button></div></section>`;bindChunks(x,id);$('main').querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>openWord(vv[Number(b.dataset.vocab)]));$('cue').onclick=()=>parent.postMessage({type:'mts:start-practice',mode:'cue',sceneId:s,lineId:id},'*');$('rehearsal').onclick=()=>parent.postMessage({type:'mts:start-practice',mode:'rehearsal',sceneId:s,lineId:id},'*');$('prevLine').onclick=()=>prev&&showLine(s,prev.id);$('nextLine').onclick=()=>next&&showLine(s,next.id);window.scrollTo(0,0)}
function showWord(lemma,surface,lineVocab){if(current)openWord(lineVocab||{lemma,surface})}
function showIdle(){$('floatNav').hidden=true;current=null;$('main').innerHTML='<section class="card"><p class="empty">台詞を選択すると、訳・Structure・Grammarを表示します。</p></section>'}
async function load(){[script,trans,vocab,grammar,dict,structure]=await Promise.all([canonical('mousetrap_script_data.json'),canonical('mousetrap_line_translations.json'),canonical('mousetrap_line_vocabulary.json'),canonical('mousetrap_line_grammar.json'),canonical('mousetrap_word_dictionary.json'),structureData()]);let c;try{c=JSON.parse(localStorage.getItem('mts.lineDetail.current')||'null')}catch{}if(c&&find(c.sceneId,c.lineId))showLine(c.sceneId,c.lineId);else showIdle()}
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='mts:line'&&script)showLine(m.sceneId,m.lineId)});window.MTS_LEARNING=Object.freeze({showLine,showWord,getCurrent:()=>current,getStructure:()=>structure});load().catch(e=>{$('floatNav').hidden=true;$('main').innerHTML=`<section class="card fail"><p class="warning">FAIL-CLOSED · PRODUCTION DATA UNAVAILABLE<br>${esc(e.message)}</p></section>`});
})();
</script></body></html>
