<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Learning Detail</title><style>
:root{--bg:#f7f5f0;--ink:#26231f;--muted:#736d65;--line:#ded8cf;--accent:#8b5e3c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.wrap{max-width:760px;margin:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3;background:rgba(247,245,240,.96);backdrop-filter:blur(12px);padding:calc(8px + env(safe-area-inset-top)) 0 8px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.speaker{font-weight:900;color:var(--accent)}.word{display:block;width:100%;text-align:left;border:1px solid #e4ddd3;background:#f5f0e9;border-radius:12px;padding:10px 12px;margin:7px 0;cursor:pointer}.word b{display:block}.word small{display:block;color:var(--muted);margin-top:3px}.back,.action{border:0;background:#26231f;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;min-height:42px}.action.secondary{background:#eee6dc;color:var(--ink)}h2{margin:.2em 0;line-height:1.45}.muted{color:var(--muted)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;background:#eee6dc;border-radius:999px;padding:5px 8px;color:#5f574f}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .action{flex:1 1 130px}.translation{font-size:17px;line-height:1.7}.grammar{line-height:1.65;border-top:1px solid #eee8df;padding-top:10px;margin-top:10px}.detail-grid{display:grid;grid-template-columns:max-content 1fr;gap:7px 12px}.detail-grid dt{font-weight:800;color:var(--muted)}.detail-grid dd{margin:0}.warning{color:#9b5b24;background:#fff4df;border:1px solid #ead0a8;border-radius:12px;padding:10px;margin:8px 0}@media(max-width:520px){.wrap{padding-inline:12px}.detail-grid{grid-template-columns:1fr}.detail-grid dt{margin-top:6px}.card{padding:14px}}
</style></head><body><div class="wrap"><div class="bar"><b>Line / Word Detail</b><button class="back" id="close">Close</button></div><main id="main">Loading…</main></div><script>
(()=>{'use strict';
let script={},trans={},vocab={},grammar={},dict={},current=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(p,required=false){try{const vr=await parent.MTS_PRIVATE_DATA?.getVerifiedResponse?.(p);if(vr)return vr.json();const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(`${p}: HTTP ${r.status}`);const d=await r.json();return d&&typeof d==='object'?d:{}}catch(e){if(required)throw e;return {__error:String(e.message||e)}}}
function find(s,id){return script?.[s]?.speeches?.find(x=>x.id===id)||null}
function sceneLabel(s){return s==='act1-scene1'?'Act I · Scene I':s==='act1-scene2'?'Act I · Scene II':s==='act2'?'Act II':s}
function sibling(s,id,delta){const a=script?.[s]?.speeches||[],i=a.findIndex(x=>x.id===id),n=i+delta;return n>=0&&n<a.length?a[n]:null}
function dictEntry(lemma){if(!lemma)return null;return dict[lemma]||dict[Object.keys(dict).find(k=>k.toLowerCase()===String(lemma).toLowerCase())]||null}
function setParentLine(s,id){try{parent.location.hash=`#/line?scene=${encodeURIComponent(s)}&line=${encodeURIComponent(id)}`}catch{}}
function showLine(s,id){const x=find(s,id);if(!x){$('main').innerHTML='<section class="card"><p class="warning">このspeechは見つかりません。</p></section>';return}current={s,id,x};localStorage.setItem('mts.lineDetail.current',JSON.stringify({sceneId:s,lineId:id}));const t=trans[id],vv=Array.isArray(vocab[id])?vocab[id]:[],gg=Array.isArray(grammar[id])?grammar[id]:[],prev=sibling(s,id,-1),next=sibling(s,id,1),missing=[];if(!t?.translation)missing.push('Translation');if(!Array.isArray(vocab[id]))missing.push('Vocabulary');if(!Array.isArray(grammar[id]))missing.push('Grammar');$('main').innerHTML=`<section class="card"><div class="speaker">${esc(x.speaker)}</div><h2>${esc(x.text)}</h2><div class="meta"><span class="chip">${esc(sceneLabel(s))}</span><span class="chip">${esc(id)}</span></div></section><section class="card"><h3>日本語訳</h3>${t?.translation?`<p class="translation">${esc(t.translation)}</p><p class="muted">Source: ${esc(t.translationSource||'source unavailable')}</p>`:'<p class="warning">このspeechの日本語訳は利用できません。</p>'}</section><section class="card"><h3>Vocabulary</h3>${vv.length?vv.map((v,i)=>{const d=dictEntry(v.lemma);return `<button class="word" data-vocab-index="${i}"><b>${esc(v.surface)} · ${esc(v.meaning)}</b><small>lemma: ${esc(v.lemma)}${d?.pos?` · ${esc(d.pos)}`:''}${d?.contextMeaning?` · context: ${esc(d.contextMeaning)}`:''}</small></button>`}).join(''):'<p class="muted">このspeechには登録Vocabularyがありません。</p>'}</section><section class="card"><h3>Grammar / Usage</h3>${gg.length?gg.map(g=>`<div class="grammar"><b>${esc(g.pattern)}</b><br>${esc(g.description)}</div>`).join(''):'<p class="muted">このspeechには追加Grammar noteがありません。</p>'}</section>${missing.length?`<section class="warning">一部学習データを読み込めません: ${esc(missing.join(', '))}。Reader自体は利用できます。</section>`:''}<section class="card"><div class="actions"><button class="action secondary" id="prevLine" ${prev?'':'disabled'}>← Prev</button><button class="action" id="cue">Cue Practice</button><button class="action secondary" id="rehearsal">Rehearsal</button><button class="action secondary" id="nextLine" ${next?'':'disabled'}>Next →</button></div></section>`;$('main').querySelectorAll('[data-vocab-index]').forEach(b=>b.onclick=()=>{const v=vv[Number(b.dataset.vocabIndex)];showWord(v?.lemma,v?.surface,v)});$('cue').onclick=()=>{localStorage.setItem('mts.practice.pending',JSON.stringify({mode:'cue',sceneId:s,lineId:id}));parent.location.hash=`#/cue?scene=${encodeURIComponent(s)}&line=${encodeURIComponent(id)}`};$('rehearsal').onclick=()=>{localStorage.setItem('mts.practice.pending',JSON.stringify({mode:'rehearsal',sceneId:s,lineId:id}));parent.location.hash=`#/rehearsal?scene=${encodeURIComponent(s)}&line=${encodeURIComponent(id)}`};$('prevLine').onclick=()=>{if(prev){setParentLine(s,prev.id);showLine(s,prev.id)}};$('nextLine').onclick=()=>{if(next){setParentLine(s,next.id);showLine(s,next.id)}}}
function showWord(lemma,surface,lineVocab){const d=dictEntry(lemma),title=surface||lemma||'Word';$('main').innerHTML=`<section class="card"><button class="action secondary" id="back">← Line Detail</button><h2>${esc(title)}</h2>${d?`<dl class="detail-grid"><dt>Headword</dt><dd>${esc(d.lemma||lemma)}</dd><dt>POS</dt><dd>${esc(d.pos||'—')}</dd><dt>IPA</dt><dd>${esc(d.ipa||'—')}</dd><dt>日本語意味</dt><dd>${esc(d.contextMeaning||lineVocab?.meaning||d.coreMeaning||'—')}</dd><dt>Core</dt><dd>${esc(d.coreMeaning||'—')}</dd><dt>In this play</dt><dd>${esc(d.contextExplanation||lineVocab?.meaning||'—')}</dd><dt>Forms</dt><dd>${esc(d.forms||'—')}</dd>${d.pattern?`<dt>Pattern</dt><dd>${esc(d.pattern)}${d.patternDesc?` — ${esc(d.patternDesc)}`:''}</dd>`:''}</dl>${Array.isArray(d.tags)&&d.tags.length?`<div class="meta">${d.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}`:`<p class="warning">Dictionary entryが見つかりません。</p>${lineVocab?`<p><b>${esc(lineVocab.lemma||lemma)}</b> · ${esc(lineVocab.meaning||'')}</p>`:''}`}</section>`;$('back').onclick=()=>current&&showLine(current.s,current.id)}
async function load(){script=await j('mousetrap_script_data.json',true);[trans,vocab,grammar,dict]=await Promise.all([j('mousetrap_line_translations.json'),j('mousetrap_line_vocabulary.json'),j('mousetrap_line_grammar.json'),j('mousetrap_word_dictionary.json')]);let c;try{c=JSON.parse(localStorage.getItem('mts.lineDetail.current')||'null')}catch{}if(c&&find(c.sceneId,c.lineId))showLine(c.sceneId,c.lineId);else{const first=script?.['act1-scene1']?.speeches?.[0];if(first)showLine('act1-scene1',first.id);else throw Error('canonical Script Data unavailable')}}
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='mts:line'&&script)showLine(m.sceneId,m.lineId)});$('close').onclick=()=>parent.location.hash='#/script';window.MTS_LEARNING=Object.freeze({showLine,showWord,getCurrent:()=>current});load().catch(e=>{$('main').innerHTML=`<section class="card"><p class="warning">Learning UIを起動できません: ${esc(e.message)}</p><button class="action" id="closeFail">Readerへ戻る</button></section>`;setTimeout(()=>{const b=$('closeFail');if(b)b.onclick=()=>parent.location.hash='#/script'},0)});
})();
</script></body></html>
