<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Detail</title><style>body{margin:0;font-family:system-ui;background:#f7f5f0;color:#26231f}.wrap{max-width:760px;margin:auto;padding:16px 16px 40px}.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f7f5f0;padding:8px 0}.card{background:white;border:1px solid #ded8cf;border-radius:18px;padding:16px;margin:12px 0}.speaker{font-weight:900;color:#8b5e3c}.word{display:inline-block;border:0;background:#eee6dc;border-radius:10px;padding:6px 9px;margin:4px;cursor:pointer}.back{border:0;background:#26231f;color:#fff;border-radius:999px;padding:9px 13px}h2{margin:.2em 0}.muted{color:#736d65}</style></head><body><div class="wrap"><div class="bar"><b>Line / Word Detail</b><button class="back" id="close">Close</button></div><main id="main">Loading…</main></div><script>(()=>{'use strict';let script,trans,vocab,grammar,dict,current=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(`${p}: HTTP ${r.status}`);return r.json()}async function load(){[script,trans,vocab,grammar,dict]=await Promise.all(['mousetrap_script_data.json','mousetrap_line_translations.json','mousetrap_line_vocabulary.json','mousetrap_line_grammar.json','mousetrap_word_dictionary.json'].map(j));let c;try{c=JSON.parse(localStorage.getItem('mts.lineDetail.current')||'null')}catch{}if(c)showLine(c.sceneId,c.lineId)}function find(s,id){return script?.[s]?.speeches?.find(x=>x.id===id)}function showLine(s,id){const x=find(s,id);if(!x)return;current={s,id,x};localStorage.setItem('mts.lineDetail.current',JSON.stringify({sceneId:s,lineId:id}));$('main').innerHTML=`<section class="card"><div class="speaker">${esc(x.speaker)}</div><h2>${esc(x.text)}</h2><p>${esc(trans[id]?.translation||'')}</p></section><section class="card"><h3>Vocabulary</h3>${(vocab[id]||[]).map(v=>`<button class="word" data-lemma="${esc(v.lemma)}" data-surface="${esc(v.surface)}">${esc(v.surface)} · ${esc(v.meaning)}</button>`).join('')||'<p class="muted">No entries</p>'}</section><section class="card"><h3>Grammar</h3>${(grammar[id]||[]).map(g=>`<p><b>${esc(g.pattern)}</b><br>${esc(g.description)}</p>`).join('')||'<p class="muted">No entries</p>'}</section><div class="card"><button id="cue">Cue Practice</button></div>`;$('main').querySelectorAll('[data-lemma]').forEach(b=>b.onclick=()=>showWord(b.dataset.lemma,b.dataset.surface));$('cue').onclick=()=>{localStorage.setItem('mts.practice.pending',JSON.stringify({mode:'cue',sceneId:s,lineId:id}));parent.location.hash=`#/cue?scene=${encodeURIComponent(s)}&line=${encodeURIComponent(id)}`}}function showWord(lemma,surface){const d=dict[lemma]||dict[Object.keys(dict).find(k=>k.toLowerCase()===String(lemma).toLowerCase())];$('main').innerHTML=`<section class="card"><button id="back">← Line Detail</button><h2>${esc(surface||lemma)}</h2><p><b>${esc(d?.coreMeaning||'')}</b></p><p>${esc(d?.contextExplanation||'')}</p><p class="muted">${esc(d?.forms||'')}</p></section>`;$('back').onclick=()=>showLine(current.s,current.id)}window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='mts:line'&&script)showLine(m.sceneId,m.lineId)});$('close').onclick=()=>parent.location.hash='#/script';load().catch(e=>$('main').textContent='FAIL-CLOSED: '+e.message)})();</script></body></html>
