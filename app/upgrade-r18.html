<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Updating Script to Stage</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f0;color:#26231f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.card{width:min(560px,88vw);background:white;border:1px solid #ded8cf;border-radius:20px;padding:24px}.muted{color:#736d65}</style></head><body><main class="card"><h2>アプリを更新しています</h2><p class="muted" id="status">旧キャッシュを解除しています…</p></main><script>(()=>{'use strict';const status=document.getElementById('status');const timeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);(async()=>{try{if('serviceWorker'in navigator){const regs=await timeout(navigator.serviceWorker.getRegistrations(),1200)||[];await timeout(Promise.allSettled(regs.map(r=>r.unregister())),1200)}if('caches'in window){const names=await timeout(caches.keys(),1200)||[];await timeout(Promise.allSettled(names.filter(n=>n.startsWith('mts-pwa-')||n==='mts-private-production-v1').map(n=>caches.delete(n))),1200)}}catch{}status.textContent='最新版を開きます…';const u=new URL('./',location.href);u.searchParams.set('mts-build','r18');u.searchParams.set('fresh',Date.now().toString(36));location.replace(u.href)})()})();</script></body></html>
